<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 - Терминал</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(20,20,20,0.8);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            text-align: center;
            border-bottom: 1px solid #2c2c2c;
        }
        header a {
            color: #ccc;
            text-decoration: none;
            font-size: 18px;
            margin: 0 20px;
            transition: 0.2s;
        }
        header a:hover { color: white; }
        #output {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            background: #010101;
        }
        .input-line {
            display: flex;
            background: #111;
            border-top: 1px solid #2c2c2c;
            padding: 12px 20px;
        }
        .prompt {
            color: white;
            font-weight: bold;
            margin-right: 12px;
            font-size: 16px;
        }
        #command {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f0f0;
            font-family: monospace;
            font-size: 16px;
        }
    </style>
</head>
<body>
<header>
    <a href="/">R2</a><a href="/screen">Экран</a><a href="/terminal">CMD</a><a href="/logs">Логи</a>
</header>
<div id="output"></div>
<div class="input-line">
    <span class="prompt">$</span>
    <input type="text" id="command" placeholder="введите команду..." autofocus>
</div>
<script>
    const outputDiv = document.getElementById('output');
    const commandInput = document.getElementById('command');
    let lastOutput = '';
    let fetchInProgress = false;
    function stripAnsi(s) { return s.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g,'').replace(/\x1b\][0-9;]*[a-zA-Z]?.*?\x07/g,'').replace(/\x07/g,''); }
    function setOutput(text) { outputDiv.innerHTML = stripAnsi(text); outputDiv.scrollTop = outputDiv.scrollHeight; }
    async function fetchOutput() {
        if (fetchInProgress) return;
        fetchInProgress = true;
        try {
            const res = await fetch('/api/cmd/output');
            const data = await res.json();
            if (data.output !== lastOutput) { setOutput(data.output); lastOutput = data.output; }
        } catch(e) {} finally { fetchInProgress = false; }
    }
    async function sendCommand(cmd) {
        await fetch('/api/cmd/send', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd}) });
        await fetchOutput();
    }
    commandInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const cmd = commandInput.value;
            if (cmd.trim()) { sendCommand(cmd); commandInput.value = ''; }
        }
    });
    fetchOutput();
    setInterval(fetchOutput, 200);
</script>
</body>
</html>
