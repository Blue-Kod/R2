<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 — Главная</title>
    <style>
        :root {
            --bg: #05070d;
            --panel: rgba(155, 175, 255, 0.1);
            --panel-strong: rgba(170, 190, 255, 0.16);
            --text: #ecf0ff;
            --muted: #aab5d6;
            --border: rgba(210, 220, 255, 0.22);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(120, 140, 255, 0.22), transparent 42%),
                radial-gradient(circle at 82% 84%, rgba(96, 208, 255, 0.2), transparent 45%),
                linear-gradient(145deg, #04060b 0%, #0d1220 40%, #0a101d 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .glass {
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
            border: 1px solid var(--border);
            backdrop-filter: blur(26px) saturate(150%);
            -webkit-backdrop-filter: blur(26px) saturate(150%);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        header {
            margin: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.04);
            transition: all 0.18s ease;
        }
        .nav-links a:hover { border-color: var(--border); background: rgba(255, 255, 255, 0.11); }
        .stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
        .stats div {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .stats span { color: var(--text); }
        .container {
            flex: 1;
            padding: 0 12px 12px;
            display: grid;
            grid-template-columns: minmax(260px, 20vw) 1fr minmax(300px, 24vw);
            gap: 12px;
            min-height: 0;
        }
        .panel {
            min-height: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .terminal-box {
            flex: 1;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(2, 6, 15, 0.55);
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.5;
            white-space: pre-wrap;
            font-family: "JetBrains Mono", "Fira Code", monospace;
            color: #bfc8e5;
        }
        .view-switch {
            display: inline-flex;
            gap: 6px;
            margin-bottom: 10px;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.05);
            align-self: flex-start;
        }
        .view-switch input[type="radio"] { display: none; }
        .view-switch label {
            cursor: pointer;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--muted);
            transition: 0.2s ease;
        }
        .view-switch input[type="radio"]:checked + label {
            color: var(--text);
            background: linear-gradient(120deg, rgba(167, 186, 255, 0.34), rgba(145, 232, 255, 0.2));
        }
        #video-container, #pointcloud-container {
            flex: 1;
            position: relative;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(0, 0, 0, 0.55);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 320px;
        }
        #video-feed { max-width: 100%; max-height: 100%; object-fit: contain; }
        #pointcloud-canvas { width: 100% !important; height: 100% !important; display: block; }
        #controls { margin-top: 10px; overflow-y: auto; max-height: 34%; padding-right: 4px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
        .control-row label { font-size: 12px; color: var(--muted); }
        .control-row input[type="checkbox"], .control-row select { accent-color: #bed2ff; }
        .control-row input[type="range"] { width: 58%; accent-color: #c8d9ff; }
        .control-group {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        #terminal-input-line { display: flex; align-items: center; margin-top: 8px; }
        #terminal-prompt { color: var(--muted); margin-right: 6px; font-family: monospace; }
        #terminal-command {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 10px;
            font-family: "JetBrains Mono", monospace;
            outline: none;
        }
        .servo-controls { margin-top: 12px; }
        .servo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
        .servo-row label { width: 95px; font-size: 11px; color: var(--muted); }
        .servo-row input[type="range"] { flex: 1; accent-color: #c8d9ff; }
        .servo-row span { width: 42px; text-align: right; font-size: 11px; color: var(--text); }
        .depth-tooltip {
            position: absolute;
            background: rgba(10, 16, 28, 0.9);
            color: var(--text);
            border: 1px solid rgba(198, 214, 255, 0.4);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
        }
        .hidden { display: none; }
        @media (max-width: 1300px) {
            .container { grid-template-columns: 1fr; overflow-y: auto; }
            .panel { min-height: 360px; }
            #controls { max-height: none; }
        }
    </style>
</head>
<body>
<header>
    <div class="nav-links">
        <a href="/">R2</a><a href="/screen">Экран</a><a href="/terminal">CMD</a><a href="/logs">Логи</a>
    </div>
    <div class="stats">
        <div>CPU: <span id="cpuStat">0</span>%</div>
        <div>RAM: <span id="ramStat">0</span>%</div>
        <div>Темп: <span id="tempStat">--</span></div>
        <div>FPS: <span id="fpsStat">0</span></div>
    </div>
</header>
<div class="container">
    <div class="panel glass panel-left">
        <div class="panel-title">Консоль скрипта</div>
        <div id="script-console" class="terminal-box"></div>
    </div>

    <!-- Центральная панель: видео / облако точек + контролы -->
    <div class="panel glass panel-center">
        <div class="view-switch" id="viewSwitch">
            <input type="radio" name="viewMode" id="viewVideo" value="video" checked>
            <label for="viewVideo">Камера / Глубина</label>
            <input type="radio" name="viewMode" id="viewCloud" value="pointcloud">
            <label for="viewCloud">Облако точек</label>
        </div>

        <div id="video-container">
            <img id="video-feed" src="/video_feed" alt="Video Stream">
            <div id="depth-tooltip" class="depth-tooltip hidden"></div>
        </div>
        <div id="pointcloud-container" style="display:none;">
            <canvas id="pointcloud-canvas"></canvas>
        </div>

        <div id="controls">
            <div class="control-row">
                <label>Основной глаз:</label>
                <div>
                    <input type="radio" name="mainEye" id="eyeLeft" checked onchange="updateParams()"> <label for="eyeLeft">Левый</label>
                    <input type="radio" name="mainEye" id="eyeRight" onchange="updateParams()"> <label for="eyeRight">Правый</label>
                </div>
            </div>
            <div class="control-row"><label>Показывать глубину:</label><input type="checkbox" id="showDepth" checked onchange="updateParams()"></div>
            <div class="control-row"><label>Прозрачность глубины:</label><input type="range" id="depthAlpha" min="0" max="100" value="30" oninput="updateParams()"></div>
            <div class="control-group">
                <div class="panel-title" style="font-size:12px;">Настройки камеры</div>
                <div class="control-row"><label>Глубина (вычисления):</label><input type="checkbox" id="depthEnabled" onchange="sendCameraParams()"></div>
                <div class="control-row"><label>WLS фильтр (медленно):</label><input type="checkbox" id="wlsEnabled" onchange="sendCameraParams()"></div>
            </div>
            <div class="control-group">
                <div class="panel-title" style="font-size:12px;">Трекинг цели</div>
                <div class="control-row"><label>Включить трекинг:</label><input type="checkbox" id="trackingEnabled" onchange="sendCameraParams()"></div>
                <div class="control-row"><label>Тип цели:</label>
                   <select id="trackingMode" onchange="sendCameraParams()">
                        <option value="person">Человек</option>
                        <option value="face">Лицо</option>
                        <option value="motion">Движение</option>
                    </select>
                </div>
                <div class="control-row"><label>Scale X (пикс):</label><input type="range" id="trackingScaleX" min="0" max="200" value="50" step="1" oninput="updateTrackingDisplay()" onchange="sendCameraParams()"><span id="scaleXVal">50</span></div>
                <div class="control-row"><label>Scale Y (пикс):</label><input type="range" id="trackingScaleY" min="0" max="200" value="30" step="1" oninput="updateTrackingDisplay()" onchange="sendCameraParams()"><span id="scaleYVal">30</span></div>
                <div class="control-row"><label>Offset X (пикс):</label><input type="range" id="trackingOffsetX" min="-100" max="100" value="0" step="1" oninput="updateTrackingDisplay()" onchange="sendCameraParams()"><span id="offsetXVal">0</span></div>
                <div class="control-row"><label>Offset Y (пикс):</label><input type="range" id="trackingOffsetY" min="-100" max="100" value="0" step="1" oninput="updateTrackingDisplay()" onchange="sendCameraParams()"><span id="offsetYVal">0</span></div>
                <div class="control-row"><label>Авто-серво по цели:</label><input type="checkbox" id="servoTrackingEnabled" onchange="setServoTracking()"></div>
            </div>
        </div>
    </div>

    <!-- Правая панель: терминал + сервоприводы -->
    <div class="panel glass panel-right">
        <div class="panel-title">Терминал</div>
        <div id="terminal-output" class="terminal-box"></div>
        <div id="terminal-input-line"><span id="terminal-prompt">$</span><input type="text" id="terminal-command" placeholder="Введите команду..."></div>
        <div class="panel-title" style="margin-top:20px;">Сервоприводы</div>
        <div class="servo-controls">
            <div class="servo-row"><label>Шея (0):</label><input type="range" id="servo0" min="0" max="180" value="90" oninput="updateServoValue(0, this.value)" onchange="setServo(0, this.value)"><span id="servo0_val">90°</span></div>
            <div class="servo-row"><label>Пр. плечо (1):</label><input type="range" id="servo1" min="0" max="270" value="135" oninput="updateServoValue(1, this.value)" onchange="setServo(1, this.value)"><span id="servo1_val">135°</span></div>
            <div class="servo-row"><label>Лев. плечо (2):</label><input type="range" id="servo2" min="0" max="270" value="135" oninput="updateServoValue(2, this.value)" onchange="setServo(2, this.value)"><span id="servo2_val">135°</span></div>
            <div class="servo-row"><label>Наклон (3):</label><input type="range" id="servo3" min="0" max="180" value="90" oninput="updateServoValue(3, this.value)" onchange="setServo(3, this.value)"><span id="servo3_val">90°</span></div>
            <div class="servo-row"><label>Пов. пр.(4):</label><input type="range" id="servo4" min="0" max="270" value="135" oninput="updateServoValue(4, this.value)" onchange="setServo(4, this.value)"><span id="servo4_val">135°</span></div>
            <div class="servo-row"><label>Пов. лев.(5):</label><input type="range" id="servo5" min="0" max="270" value="135" oninput="updateServoValue(5, this.value)" onchange="setServo(5, this.value)"><span id="servo5_val">135°</span></div>
        </div>
    </div>
</div>

<!-- Подключаем Three.js через importmap -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- 3D сцена для облака точек ----------
    const videoContainer = document.getElementById('video-container');
    const cloudContainer = document.getElementById('pointcloud-container');
    const canvas = document.getElementById('pointcloud-canvas');
    const viewVideoRadio = document.getElementById('viewVideo');
    const viewCloudRadio = document.getElementById('viewCloud');

    let scene, camera, renderer, controls;
    let pointsMesh = null;
    let animationId = null;
    let pointCloudActive = false;
    let lastPointFetch = 0;

    function initThreeJS() {
        // Создаём сцену
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        // Камера
        const containerWidth = cloudContainer.clientWidth;
        const containerHeight = cloudContainer.clientHeight;
        camera = new THREE.PerspectiveCamera(60, containerWidth / containerHeight, 0.1, 1000);
        camera.position.set(0, 0, 80);
        camera.lookAt(0, 0, 40);

        // Рендерер
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(containerWidth, containerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Управление
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.target.set(0, 0, 40);
        controls.update();

        // Начальные пустые точки
        const geometry = new THREE.BufferGeometry();
        const material = new THREE.PointsMaterial({
            color: 0xcccccc,
            size: 0.8,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        pointsMesh = new THREE.Points(geometry, material);
        scene.add(pointsMesh);

        // Сетка для ориентации
        const gridHelper = new THREE.GridHelper(100, 20, 0x333333, 0x222222);
        scene.add(gridHelper);

        // Оси
        const axesHelper = new THREE.AxesHelper(50);
        scene.add(axesHelper);

        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        if (!pointCloudActive) return;
        const w = cloudContainer.clientWidth;
        const h = cloudContainer.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    async function updatePointCloud() {
        if (!pointCloudActive) return;
        try {
            const resp = await fetch('/api/pointcloud?step=2');
            const points = await resp.json();
            if (!points.length) return;

            const positions = new Float32Array(points.length * 3);
            points.forEach((p, i) => {
                positions[i * 3] = p.x;
                positions[i * 3 + 1] = -p.y;  // инвертируем Y для естественного вида
                positions[i * 3 + 2] = p.z;
            });

            pointsMesh.geometry.dispose();
            pointsMesh.geometry = new THREE.BufferGeometry();
            pointsMesh.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        } catch (e) {
            console.error('Ошибка получения облака точек:', e);
        }
    }

    function animate() {
        if (!pointCloudActive) return;
        animationId = requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);

        // Обновляем облако точек с интервалом 500 мс
        const now = performance.now();
        if (now - lastPointFetch > 500) {
            lastPointFetch = now;
            updatePointCloud();
        }
    }

    function startPointCloud() {
        if (!scene) initThreeJS();
        videoContainer.style.display = 'none';
        cloudContainer.style.display = 'flex';
        pointCloudActive = true;
        lastPointFetch = 0;
        onWindowResize();
        animate();
    }

    function stopPointCloud() {
        pointCloudActive = false;
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        cloudContainer.style.display = 'none';
        videoContainer.style.display = 'flex';
    }

    // Обработчики переключения режима
    viewVideoRadio.addEventListener('change', () => {
        if (viewVideoRadio.checked) stopPointCloud();
    });
    viewCloudRadio.addEventListener('change', () => {
        if (viewCloudRadio.checked) startPointCloud();
    });

    // ---------- Остальная логика главной страницы ----------
    async function fetchSystemStats() {
        try {
            const r = await fetch('/api/data');
            const d = await r.json();
            document.getElementById('cpuStat').innerText = d.cpu;
            document.getElementById('ramStat').innerText = d.ram;
            document.getElementById('tempStat').innerText = d.temp;
            document.getElementById('fpsStat').innerText = d.fps;
        } catch(e) { console.error(e); }
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    setInterval(fetchSystemStats, 2000);
    fetchSystemStats();

    // Управление глубиной
    const eyeLeft = document.getElementById('eyeLeft'), eyeRight = document.getElementById('eyeRight'), showDepth = document.getElementById('showDepth'), depthAlpha = document.getElementById('depthAlpha');
    function updateParams() {
        fetch('/update', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ alpha_depth: showDepth.checked ? parseInt(depthAlpha.value) : 0, show_left: eyeLeft.checked, num_disp:5 }) }).catch(console.error);
    }

    // Глубина по наведению (только в режиме камеры)
    const video = document.getElementById('video-feed'), tooltip = document.getElementById('depth-tooltip');
    video.addEventListener('mousemove', (e) => {
        if(!showDepth.checked) { tooltip.classList.add('hidden'); return; }
        const rect = video.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        const sx = video.naturalWidth/rect.width, sy = video.naturalHeight/rect.height;
        const ix = Math.round(x*sx), iy = Math.round(y*sy);
        fetch('/api/depth', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({x:ix, y:iy}) }).then(res=>res.json()).then(data=>{ if(data.depth!==null && data.depth!==undefined) { tooltip.classList.remove('hidden'); tooltip.style.left=(e.clientX+15)+'px'; tooltip.style.top=(e.clientY+15)+'px'; tooltip.textContent=`${data.depth.toFixed(1)} см`; } else tooltip.classList.add('hidden'); }).catch(()=>tooltip.classList.add('hidden'));
    });
    video.addEventListener('mouseleave', ()=>tooltip.classList.add('hidden'));

    // Терминал и поток консоли скрипта
    const terminalOutput = document.getElementById('terminal-output');
    const scriptConsole = document.getElementById('script-console');
    const terminalCommand = document.getElementById('terminal-command');
    let lastOutput='', fetchInProgress=false, sendInProgress=false;
    function stripAnsi(s){ return s.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g,'').replace(/\x1b\][0-9;]*[a-zA-Z]?.*?\x07/g,'').replace(/\x1b\\/g,'').replace(/\x07/g,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n'); }
    async function fetchTerminalOutput(){
        if(fetchInProgress) return;
        fetchInProgress=true;
        try{
            const r=await fetch('/api/cmd/output');
            const d=await r.json();
            if(d.output!==lastOutput){
                const clean = stripAnsi(d.output);
                terminalOutput.textContent = clean;
                scriptConsole.textContent = clean;
                terminalOutput.scrollTop = terminalOutput.scrollHeight;
                scriptConsole.scrollTop = scriptConsole.scrollHeight;
                lastOutput=d.output;
            }
        }catch(e){} finally{ fetchInProgress=false; }
    }
    async function sendTerminalCommand(cmd){ if(sendInProgress) return; sendInProgress=true; try{ await fetch('/api/cmd/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})}); await fetchTerminalOutput(); }catch(e){} finally{ sendInProgress=false; } }
    terminalCommand.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ const cmd=terminalCommand.value; if(cmd.trim()!==''){ terminalOutput.textContent += `$ ${cmd}\n`; lastOutput += `$ ${cmd}\n`; sendTerminalCommand(cmd); terminalCommand.value=''; } } });
    fetchTerminalOutput(); setInterval(fetchTerminalOutput,200);

    // Параметры камеры
    const depthEnabledChk = document.getElementById('depthEnabled'), wlsEnabledChk = document.getElementById('wlsEnabled'), trackingEnabled = document.getElementById('trackingEnabled'), trackingMode = document.getElementById('trackingMode');
    const trackingScaleX = document.getElementById('trackingScaleX'), trackingScaleY = document.getElementById('trackingScaleY'), trackingOffsetX = document.getElementById('trackingOffsetX'), trackingOffsetY = document.getElementById('trackingOffsetY');
    const scaleXVal=document.getElementById('scaleXVal'), scaleYVal=document.getElementById('scaleYVal'), offsetXVal=document.getElementById('offsetXVal'), offsetYVal=document.getElementById('offsetYVal');
    function updateTrackingDisplay(){ scaleXVal.innerText=trackingScaleX.value; scaleYVal.innerText=trackingScaleY.value; offsetXVal.innerText=trackingOffsetX.value; offsetYVal.innerText=trackingOffsetY.value; }
    async function loadCameraParams(){ try{ const r=await fetch('/api/camera/params'); const p=await r.json(); depthEnabledChk.checked=p.depth_enabled; wlsEnabledChk.checked=p.wls_enabled; trackingEnabled.checked=p.face_tracking_enabled; trackingMode.value=p.tracking_mode; trackingScaleX.value=p.tracking_scale_x; trackingScaleY.value=p.tracking_scale_y; trackingOffsetX.value=p.tracking_offset_x; trackingOffsetY.value=p.tracking_offset_y; updateTrackingDisplay(); }catch(e){ console.error(e); } }
    async function sendCameraParams(){ const params={ depth_enabled: depthEnabledChk.checked, face_tracking_enabled: trackingEnabled.checked, tracking_mode: trackingMode.value, wls_enabled: wlsEnabledChk.checked, tracking_scale_x: parseInt(trackingScaleX.value), tracking_scale_y: parseInt(trackingScaleY.value), tracking_offset_x: parseInt(trackingOffsetX.value), tracking_offset_y: parseInt(trackingOffsetY.value) }; try{ await fetch('/api/camera/params',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)}); }catch(e){ console.error(e); } }
    loadCameraParams();

    // Сервоприводы
    function updateServoValue(ch,val){ document.getElementById(`servo${ch}_val`).innerText = val+'°'; }
    function setServo(ch,angle){ fetch(`/api/servo/${ch}/${angle}`,{method:'POST'}).catch(console.error); }
    const servoTrackingChk = document.getElementById('servoTrackingEnabled');
    async function setServoTracking(){ const enabled = servoTrackingChk.checked; try{ await fetch('/api/servo/tracking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})}); }catch(e){ console.error(e); } }
    async function loadServoTracking(){ try{ const r=await fetch('/api/servo/tracking'); const d=await r.json(); servoTrackingChk.checked=d.enabled; }catch(e){} }
    loadServoTracking();
    window.addEventListener('load',()=>{ for(let ch=0;ch<=5;ch++){ const s=document.getElementById(`servo${ch}`); if(s) updateServoValue(ch,s.value); } });
</script>
