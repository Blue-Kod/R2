<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 - Liquid Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #00e5ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }
        .nav-links a {
            color: #ccc;
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--accent); }

        .main-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Визуализатор */
        #viewport-container {
            position: relative;
            flex: 1;
        }
        .view-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 12px;
        }
        .view-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .view-btn.active { background: var(--accent); color: #000; font-weight: bold; }

        #video-feed, #three-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Боковая панель управления */
        .controls-panel { padding: 25px; overflow-y: auto; }
        .panel-section { margin-bottom: 30px; }
        h3 { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); margin-bottom: 15px; letter-spacing: 2px; }

        .slider-group { margin-bottom: 15px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; color: #aaa; }
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            appearance: none;
            accent-color: var(--accent);
        }

        /* Консоль внизу справа */
        #console-box {
            height: 200px;
            background: rgba(0,0,0,0.2);
            font-family: 'Consolas', monospace;
            font-size: 0.75rem;
            padding: 15px;
            overflow-y: auto;
            color: #00ffaa;
            border-top: 1px solid var(--border);
        }
        .log-entry { margin-bottom: 4px; opacity: 0.8; }

        .stats-bar { display: flex; gap: 20px; font-size: 0.8rem; color: #888; }
        .stats-bar span b { color: white; }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 1.5rem; font-weight: 200; letter-spacing: 4px;">R2<span style="color:var(--accent)">_OS</span></div>
        <div class="stats-bar">
            <span>CPU: <b id="stat-cpu">-</b></span>
            <span>TEMP: <b id="stat-temp">-</b></span>
            <span>RAM: <b id="stat-ram">-</b></span>
        </div>
        <nav class="nav-links">
            <a href="/">DASHBOARD</a>
            <a href="/screen">EYES</a>
            <a href="/terminal">TERMINAL</a>
        </nav>
    </header>

    <main class="main-layout">
        <div class="glass-card" id="viewport-container">
            <div class="view-toggle">
                <button class="view-btn active" onclick="switchView('2d')">DEPTH CAM</button>
                <button class="view-btn" onclick="switchView('3d')">POINT CLOUD</button>
            </div>
            <img id="video-feed" src="/api/camera/video_feed">
            <div id="three-canvas" style="display: none;"></div>
        </div>

        <div class="glass-card">
            <div class="controls-panel">
                <div class="panel-section">
                    <h3>Servo Control</h3>
                    <div id="servo-controls"></div>
                </div>

                <div class="panel-section">
                    <h3>AI Systems</h3>
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem;">
                        <input type="checkbox" id="tracking-chk" onchange="toggleTracking()">
                        Auto-Tracking Face
                    </label>
                </div>
            </div>
            <div id="console-box"></div>
        </div>
    </main>

    <script>
        // --- 3D Logic ---
        let scene, camera3d, renderer, points, controls;
        const canvasContainer = document.getElementById('three-canvas');

        function init3D() {
            scene = new THREE.Scene();
            camera3d = new THREE.PerspectiveCamera(75, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            canvasContainer.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera3d, renderer.domElement);
            camera3d.position.set(0, 0, 2);

            const geometry = new THREE.BufferGeometry();
            const material = new THREE.PointsMaterial({ size: 0.015, vertexColors: true });
            points = new THREE.Points(geometry, material);
            scene.add(points);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera3d);
        }

        async function updatePointCloud() {
            if (canvasContainer.style.display === 'none') return;
            try {
                const r = await fetch('/api/camera/pointcloud');
                const data = await r.json();
                if (data.points) {
                    points.geometry.setAttribute('position', new THREE.Float32BufferAttribute(data.points, 3));
                    if (data.colors) {
                        points.geometry.setAttribute('color', new THREE.Float32BufferAttribute(data.colors, 3));
                    }
                }
            } catch(e) {}
            setTimeout(updatePointCloud, 100);
        }

        // --- UI Logic ---
        function switchView(mode) {
            const feed = document.getElementById('video-feed');
            const btns = document.querySelectorAll('.view-btn');
            btns.forEach(b => b.classList.remove('active'));

            if (mode === '3d') {
                feed.style.display = 'none';
                canvasContainer.style.display = 'block';
                btns[1].classList.add('active');
                if (!scene) init3D();
                updatePointCloud();
            } else {
                feed.style.display = 'block';
                canvasContainer.style.display = 'none';
                btns[0].classList.add('active');
            }
        }

        // Servos
        const servoNames = ['NECK', 'R_SHOULDER', 'L_SHOULDER', 'TILT', 'R_ELBOW', 'L_ELBOW'];
        const ctrlDiv = document.getElementById('servo-controls');
        servoNames.forEach((name, i) => {
            ctrlDiv.innerHTML += `
                <div class="slider-group">
                    <div class="slider-header"><span>${name}</span><span id="v${i}">90°</span></div>
                    <input type="range" min="0" max="180" value="90" oninput="moveServo(${i}, this.value)">
                </div>
            `;
        });

        function moveServo(ch, val) {
            document.getElementById(`v${ch}`).innerText = val + '°';
            fetch(`/api/servo/${ch}/${val}`, {method: 'POST'});
        }

        // Console & Stats
        async function updateSystem() {
            const [cRes, sRes] = await Promise.all([fetch('/api/console'), fetch('/api/stats')]);
            const cData = await cRes.json();
            const sData = await sRes.json();

            document.getElementById('console-box').innerHTML = cData.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
            const cb = document.getElementById('console-box');
            cb.scrollTop = cb.scrollHeight;

            document.getElementById('stat-cpu').innerText = sData.cpu;
            document.getElementById('stat-temp').innerText = sData.temp;
            document.getElementById('stat-ram').innerText = sData.ram;
        }

        setInterval(updateSystem, 1000);
        function toggleTracking() {
            const enabled = document.getElementById('tracking-chk').checked;
            fetch('/api/servo/tracking', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({enabled})});
        }

        window.onresize = () => {
            if (camera3d) {
                camera3d.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
                camera3d.updateProjectionMatrix();
                renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            }
        };
    </script>
</body>
</html>
