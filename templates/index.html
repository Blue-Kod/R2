<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>R2 — Главная | Управление роботом</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0a;
            --panel: #121212;
            --panel-2: #151515;
            --text: #f0f0f0;
            --muted: #9c9c9c;
            --line: #2a2a2a;
            --accent: #2c6e9e;
            --cam-w: 853px;
            --cam-h: 480px;
        }

        html, body {
            height: 100%;
            background: var(--bg);
        }

        body {
            overflow: hidden;
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
        }

        /* кастомный скролл */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #333 #0a0a0a;
        }

        .layout {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            padding: 16px;
        }

        /* шапка */
        .topbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-links a:hover {
            background: #1f1f1f;
            border-color: #3a3a3a;
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .stats div {
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px 12px;
            background: var(--panel);
            backdrop-filter: blur(2px);
        }

        .stats span {
            color: var(--text);
            font-weight: 600;
            margin-left: 4px;
        }

        /* основная сетка */
        .container {
            display: grid;
            grid-template-columns: 260px minmax(0, var(--cam-w)) 1fr;
            gap: 14px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .panel {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .panel-title {
            font-size: 11px;
            letter-spacing: 1.2px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* стили для терминала */
        .terminal-box {
            flex: 1;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: #0d0d0d;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', Consolas, monospace;
            color: #e0e0e0;
        }

        /* вкладки */
        .tabs {
            display: inline-flex;
            gap: 6px;
            margin-bottom: 10px;
            padding: 4px;
            border-radius: 40px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--line);
            align-self: flex-start;
        }

        .tabs button {
            cursor: pointer;
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            background: transparent;
            transition: 0.2s;
        }

        .tabs button.active {
            color: white;
            background: #2a2a2a;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* видео / облако */
        #video-container, #pointcloud-container {
            width: var(--cam-w);
            height: var(--cam-h);
            flex-shrink: 0;
            position: relative;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: #070707;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-feed {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        #pointcloud-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* сервопанель */
        .servo-controls {
            overflow-y: auto;
            flex: 1;
            padding-right: 6px;
        }

        .servo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .servo-row label {
            width: 100px;
            font-size: 11.5px;
            color: var(--muted);
        }

        .servo-row input[type="range"] {
            flex: 1;
            accent-color: #ffffff;
            background: #2a2a2a;
            height: 4px;
            border-radius: 4px;
        }

        .servo-row span {
            width: 45px;
            text-align: right;
            font-size: 11px;
            font-weight: 500;
            color: #ddd;
        }

        /* контролы камера/трекинг */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .control-row label {
            font-size: 12px;
            color: var(--muted);
        }

        input[type="checkbox"], input[type="radio"] {
            accent-color: #3a86ff;
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }

        select, input[type="range"] {
            background: #1e1e1e;
            border: 1px solid var(--line);
            color: white;
            border-radius: 8px;
            padding: 6px 8px;
        }

        #camera-controls, #tracking-controls {
            overflow-y: auto;
            max-height: 220px;
            padding-right: 4px;
        }

        .control-group {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
        }

        .depth-tooltip {
            position: absolute;
            background: #111;
            color: white;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 1280px) {
            .container {
                grid-template-columns: 1fr;
                overflow: auto;
            }
            body { overflow: auto; }
            .layout { height: auto; }
            #video-container, #pointcloud-container { width: 100%; }
        }
    </style>
</head>
<body>
<div class="layout">
    <header class="topbar">
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/screen">Экран</a>
        </div>
        <div class="stats">
            <div>CPU: <span id="cpuStat">0</span>%</div>
            <div>RAM: <span id="ramStat">0</span>%</div>
            <div>Темп: <span id="tempStat">--</span></div>
            <div>FPS: <span id="fpsStat">0</span></div>
        </div>
    </header>

    <div class="container">
        <!-- левая панель: сервоприводы -->
        <aside class="panel">
            <div class="panel-title">Сервоприводы (Dynamixel)</div>
            <div class="servo-controls">
                <div class="servo-row"><label>Шея (0):</label><input type="range" id="servo0" min="0" max="180" value="90"><span id="servo0_val">90°</span></div>
                <div class="servo-row"><label>Пр. плечо (1):</label><input type="range" id="servo1" min="0" max="270" value="135"><span id="servo1_val">135°</span></div>
                <div class="servo-row"><label>Лев. плечо (2):</label><input type="range" id="servo2" min="0" max="270" value="135"><span id="servo2_val">135°</span></div>
                <div class="servo-row"><label>Наклон (3):</label><input type="range" id="servo3" min="0" max="180" value="90"><span id="servo3_val">90°</span></div>
                <div class="servo-row"><label>Пов. пр.(4):</label><input type="range" id="servo4" min="0" max="270" value="135"><span id="servo4_val">135°</span></div>
                <div class="servo-row"><label>Пов. лев.(5):</label><input type="range" id="servo5" min="0" max="270" value="135"><span id="servo5_val">135°</span></div>
            </div>
        </aside>

        <!-- центральная панель: видео / облако точек + управление камерой -->
        <main class="panel">
            <div class="tabs" id="viewTabs">
                <button id="tabVideo" class="active">Камера</button>
                <button id="tabCloud">Облако точек</button>
            </div>

            <div id="video-container">
                <img id="video-feed" src="/video_feed" alt="Video Stream" crossorigin="anonymous">
                <div id="depth-tooltip" class="depth-tooltip hidden"></div>
            </div>
            <div id="pointcloud-container" class="hidden">
                <canvas id="pointcloud-canvas"></canvas>
            </div>

            <div class="tabs" id="controlsTabs" style="margin-top: 12px;">
                <button id="tabCameraControls" class="active">Параметры камеры</button>
                <button id="tabTrackingControls">Трекинг & CV</button>
            </div>

            <div id="camera-controls">
                <div class="control-row">
                    <label>Основной глаз:</label>
                    <div style="display: flex; gap: 12px;">
                        <label><input type="radio" name="mainEye" id="eyeLeft" checked> Левый</label>
                        <label><input type="radio" name="mainEye" id="eyeRight"> Правый</label>
                    </div>
                </div>
                <div class="control-row"><label>Показывать глубину:</label><input type="checkbox" id="showDepth" checked></div>
                <div class="control-row"><label>Прозрачность глубины:</label><input type="range" id="depthAlpha" min="0" max="100" value="30"></div>
                <div class="control-group">
                    <div class="control-row"><label>Глубина (вычисления):</label><input type="checkbox" id="depthEnabled"></div>
                    <div class="control-row"><label>WLS фильтр:</label><input type="checkbox" id="wlsEnabled"></div>
                </div>
            </div>

            <div id="tracking-controls" class="hidden">
                <div class="control-row"><label>Включить трекинг:</label><input type="checkbox" id="trackingEnabled"></div>
                <div class="control-row"><label>Тип цели:</label>
                    <select id="trackingMode">
                        <option value="person">Человек</option>
                        <option value="face">Лицо</option>
                        <option value="motion">Движение</option>
                    </select>
                </div>
                <div class="control-row"><label>Scale X:</label><input type="range" id="trackingScaleX" min="0" max="200" value="50" step="1"><span id="scaleXVal">50</span></div>
                <div class="control-row"><label>Scale Y:</label><input type="range" id="trackingScaleY" min="0" max="200" value="30" step="1"><span id="scaleYVal">30</span></div>
                <div class="control-row"><label>Offset X:</label><input type="range" id="trackingOffsetX" min="-100" max="100" value="0" step="1"><span id="offsetXVal">0</span></div>
                <div class="control-row"><label>Offset Y:</label><input type="range" id="trackingOffsetY" min="-100" max="100" value="0" step="1"><span id="offsetYVal">0</span></div>
                <div class="control-row"><label>Авто-серво по цели:</label><input type="checkbox" id="servoTrackingEnabled"></div>
            </div>
        </main>

        <!-- правая панель: терминал + логи -->
        <aside class="panel">
            <div class="tabs" id="rightTabs">
                <button id="tabTerminal" class="active">Терминал</button>
                <button id="tabLogs">Логи системы</button>
            </div>
            <div id="terminal-pane" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div id="terminal-output" class="terminal-box">➜ Ожидание команд...</div>
                <div id="terminal-input-line" style="display: flex; margin-top: 8px; gap: 8px; align-items: center;">
                    <span id="terminal-prompt" style="color:#6a9955; font-family: monospace;">❯</span>
                    <input type="text" id="terminal-command" placeholder="Введите команду (help, ls, ...)" style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius: 12px; padding: 8px 12px; font-family: monospace; outline: none;">
                </div>
            </div>
            <div id="logs-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div id="logs-output" class="terminal-box">📡 Логи загрузятся автоматически...</div>
            </div>
        </aside>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- DOM элементы ----------
    const videoContainer = document.getElementById('video-container');
    const cloudContainer = document.getElementById('pointcloud-container');
    const tabVideo = document.getElementById('tabVideo');
    const tabCloud = document.getElementById('tabCloud');
    const tabCameraControls = document.getElementById('tabCameraControls');
    const tabTrackingControls = document.getElementById('tabTrackingControls');
    const cameraControlsDiv = document.getElementById('camera-controls');
    const trackingControlsDiv = document.getElementById('tracking-controls');
    const tabTerminal = document.getElementById('tabTerminal');
    const tabLogs = document.getElementById('tabLogs');
    const terminalPane = document.getElementById('terminal-pane');
    const logsPane = document.getElementById('logs-pane');
    const logsOutput = document.getElementById('logs-output');
    const videoFeed = document.getElementById('video-feed');
    const depthTooltip = document.getElementById('depth-tooltip');

    // параметры камеры / UI
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const showDepthChk = document.getElementById('showDepth');
    const depthAlphaSlider = document.getElementById('depthAlpha');
    const depthEnabledChk = document.getElementById('depthEnabled');
    const wlsEnabledChk = document.getElementById('wlsEnabled');
    const trackingEnabledChk = document.getElementById('trackingEnabled');
    const trackingModeSelect = document.getElementById('trackingMode');
    const trackingScaleX = document.getElementById('trackingScaleX');
    const trackingScaleY = document.getElementById('trackingScaleY');
    const trackingOffsetX = document.getElementById('trackingOffsetX');
    const trackingOffsetY = document.getElementById('trackingOffsetY');
    const scaleXSpan = document.getElementById('scaleXVal');
    const scaleYSpan = document.getElementById('scaleYVal');
    const offsetXSpan = document.getElementById('offsetXVal');
    const offsetYSpan = document.getElementById('offsetYVal');
    const servoTrackingChk = document.getElementById('servoTrackingEnabled');

    // Three.js переменные
    let scene, camera3D, renderer, orbitControls;
    let pointsMesh = null;
    let animationId = null;
    let pointCloudActive = false;
    let lastPointFetch = 0;

    // ---------- вспомогательные функции UI ----------
    function setActiveTab(activeBtn, allBtns) {
        allBtns.forEach(btn => btn.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    // обновление отображения значений трекинга
    function updateTrackingDisplay() {
        scaleXSpan.innerText = trackingScaleX.value;
        scaleYSpan.innerText = trackingScaleY.value;
        offsetXSpan.innerText = trackingOffsetX.value;
        offsetYSpan.innerText = trackingOffsetY.value;
    }

    // сервоприводы (всплывающие)
    function updateServoValue(channel, val) {
        const span = document.getElementById(`servo${channel}_val`);
        if (span) span.innerText = val + '°';
    }

    async function setServo(channel, angle) {
        try {
            await fetch(`/api/servo/${channel}/${angle}`, { method: 'POST' });
        } catch(e) { console.warn("servo err", e); }
    }

    // Отправка параметров камеры + трекинг
    async function sendCameraParams() {
        const payload = {
            depth_enabled: depthEnabledChk.checked,
            face_tracking_enabled: trackingEnabledChk.checked,
            tracking_mode: trackingModeSelect.value,
            wls_enabled: wlsEnabledChk.checked,
            tracking_scale_x: parseInt(trackingScaleX.value, 10),
            tracking_scale_y: parseInt(trackingScaleY.value, 10),
            tracking_offset_x: parseInt(trackingOffsetX.value, 10),
            tracking_offset_y: parseInt(trackingOffsetY.value, 10)
        };
        try {
            await fetch('/api/camera/params', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch(err) { console.warn("camera params post error", err); }
    }

    // Параметры отображения глубины + основной глаз
    async function updateRenderParams() {
        const alpha = showDepthChk.checked ? parseInt(depthAlphaSlider.value, 10) : 0;
        const showLeft = eyeLeft.checked;
        try {
            await fetch('/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ alpha_depth: alpha, show_left: showLeft, num_disp: 5 })
            });
        } catch(e) { console.warn("update error", e); }
    }

    async function loadCameraParams() {
        try {
            const res = await fetch('/api/camera/params');
            const p = await res.json();
            depthEnabledChk.checked = p.depth_enabled;
            wlsEnabledChk.checked = p.wls_enabled;
            trackingEnabledChk.checked = p.face_tracking_enabled;
            trackingModeSelect.value = p.tracking_mode || 'face';
            trackingScaleX.value = p.tracking_scale_x ?? 50;
            trackingScaleY.value = p.tracking_scale_y ?? 30;
            trackingOffsetX.value = p.tracking_offset_x ?? 0;
            trackingOffsetY.value = p.tracking_offset_y ?? 0;
            updateTrackingDisplay();
        } catch(e) { console.warn("load camera params", e); }
    }

    async function loadServoTrackingState() {
        try {
            const res = await fetch('/api/servo/tracking');
            const data = await res.json();
            servoTrackingChk.checked = data.enabled === true;
        } catch(e) {}
    }

    async function setServoTracking() {
        try {
            await fetch('/api/servo/tracking', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: servoTrackingChk.checked })
            });
        } catch(e) {}
    }

    // ---------- терминал ----------
    let lastTerminalOutput = '';
    let fetchingTerminal = false;
    let sendingCmd = false;
    const terminalOutputDiv = document.getElementById('terminal-output');
    const terminalInput = document.getElementById('terminal-command');

    function stripAnsi(s) {
        return s.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '').replace(/\x1b\][0-9;]*[a-zA-Z]?.*?\x07/g, '')
                .replace(/\x1b\\/g, '').replace(/\x07/g, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    }

    async function fetchTerminalOutput() {
        if (fetchingTerminal) return;
        fetchingTerminal = true;
        try {
            const resp = await fetch('/api/cmd/output');
            const data = await resp.json();
            if (data.output !== lastTerminalOutput) {
                terminalOutputDiv.textContent = stripAnsi(data.output);
                terminalOutputDiv.scrollTop = terminalOutputDiv.scrollHeight;
                lastTerminalOutput = data.output;
            }
        } catch (e) {}
        finally { fetchingTerminal = false; }
    }

    async function sendTerminalCommand(cmd) {
        if (sendingCmd || !cmd.trim()) return;
        sendingCmd = true;
        try {
            await fetch('/api/cmd/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: cmd }) });
            await fetchTerminalOutput();
        } catch(e) {}
        finally { sendingCmd = false; }
    }

    // системная статистика
    async function fetchSystemStats() {
        try {
            const r = await fetch('/api/data');
            const d = await r.json();
            document.getElementById('cpuStat').innerText = d.cpu ?? 0;
            document.getElementById('ramStat').innerText = d.ram ?? 0;
            document.getElementById('tempStat').innerText = d.temp ?? '--';
            document.getElementById('fpsStat').innerText = d.fps ?? 0;
            if (Array.isArray(d.logs) && logsOutput) {
                logsOutput.textContent = d.logs.join('\n');
                logsOutput.scrollTop = logsOutput.scrollHeight;
            }
        } catch(e) {}
    }

    // ---------- 3D облако точек (Three.js) ----------
    function initThree() {
        const w = cloudContainer.clientWidth;
        const h = cloudContainer.clientHeight;
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        camera3D = new THREE.PerspectiveCamera(60, w / h, 0.01, 50);
        camera3D.position.set(0.8, 0.6, 1.4);
        camera3D.lookAt(0, 0, 0);
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('pointcloud-canvas'), antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(window.devicePixelRatio);
        orbitControls = new OrbitControls(camera3D, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.08;
        orbitControls.target.set(0, 0, 0);
        orbitControls.update();
        pointsMesh = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ size: 0.012, sizeAttenuation: true, vertexColors: true, blending: THREE.AdditiveBlending }));
        scene.add(pointsMesh);
        scene.add(new THREE.GridHelper(4, 40, 0x606060, 0x2e2e2e));
        scene.add(new THREE.AxesHelper(0.6));
        const originSphere = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffaa44 }));
        originSphere.position.set(0, 0, 0);
        scene.add(originSphere);
        window.addEventListener('resize', onResize3D);
    }

    function onResize3D() {
        if (!pointCloudActive) return;
        const w = cloudContainer.clientWidth;
        const h = cloudContainer.clientHeight;
        camera3D.aspect = w / h;
        camera3D.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    async function updatePointCloudData() {
        if (!pointCloudActive) return;
        try {
            const resp = await fetch('/api/pointcloud?step=2');
            const points = await resp.json();
            if (!points || !points.length) return;
            const positions = new Float32Array(points.length * 3);
            const colors = new Float32Array(points.length * 3);
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                positions[i*3] = p.x / 100.0;
                positions[i*3+1] = -p.y / 100.0;
                positions[i*3+2] = p.z / 100.0;
                // Синие точки для стиля
                colors[i*3] = 0.2;
                colors[i*3+1] = 0.5;
                colors[i*3+2] = 1.0;
            }
            pointsMesh.geometry.dispose();
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            pointsMesh.geometry = geom;
        } catch(e) {}
    }

    function animatePointCloud() {
        if (!pointCloudActive) return;
        animationId = requestAnimationFrame(animatePointCloud);
        orbitControls.update();
        renderer.render(scene, camera3D);
        const now = performance.now();
        if (now - lastPointFetch > 500) {
            lastPointFetch = now;
            updatePointCloudData();
        }
    }

    function startPointCloud() {
        if (!scene) initThree();
        videoContainer.classList.add('hidden');
        cloudContainer.classList.remove('hidden');
        pointCloudActive = true;
        onResize3D();
        if (animationId) cancelAnimationFrame(animationId);
        animatePointCloud();
    }

    function stopPointCloud() {
        pointCloudActive = false;
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        cloudContainer.classList.add('hidden');
        videoContainer.classList.remove('hidden');
    }

    // ----- глубина (тултип) -----
    function initDepthTooltip() {
        videoFeed.addEventListener('mousemove', async (e) => {
            if (!showDepthChk.checked) {
                depthTooltip.classList.add('hidden');
                return;
            }
            const rect = videoFeed.getBoundingClientRect();
            const containerRect = videoContainer.getBoundingClientRect();
            const sx = videoFeed.naturalWidth / rect.width;
            const sy = videoFeed.naturalHeight / rect.height;
            const ix = Math.round((e.clientX - rect.left) * sx);
            const iy = Math.round((e.clientY - rect.top) * sy);
            try {
                const resp = await fetch('/api/depth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: ix, y: iy })
                });
                const data = await resp.json();
                if (data.depth !== null && data.depth !== undefined) {
                    depthTooltip.classList.remove('hidden');
                    depthTooltip.style.left = (e.clientX - containerRect.left + 12) + 'px';
                    depthTooltip.style.top = (e.clientY - containerRect.top + 12) + 'px';
                    depthTooltip.textContent = `${data.depth.toFixed(1)} см`;
                } else {
                    depthTooltip.classList.add('hidden');
                }
            } catch(_) { depthTooltip.classList.add('hidden'); }
        });
        videoFeed.addEventListener('mouseleave', () => depthTooltip.classList.add('hidden'));
    }

    // ---------- ПРИВЯЗКА ВСЕХ СОБЫТИЙ (без inline) ----------
    function attachAllEventListeners() {
        // вкладки видео/облако
        tabVideo.addEventListener('click', () => {
            setActiveTab(tabVideo, [tabVideo, tabCloud]);
            stopPointCloud();
        });
        tabCloud.addEventListener('click', () => {
            setActiveTab(tabCloud, [tabVideo, tabCloud]);
            startPointCloud();
        });
        // вкладки управления камерой / трекинг
        tabCameraControls.addEventListener('click', () => {
            setActiveTab(tabCameraControls, [tabCameraControls, tabTrackingControls]);
            cameraControlsDiv.classList.remove('hidden');
            trackingControlsDiv.classList.add('hidden');
        });
        tabTrackingControls.addEventListener('click', () => {
            setActiveTab(tabTrackingControls, [tabCameraControls, tabTrackingControls]);
            trackingControlsDiv.classList.remove('hidden');
            cameraControlsDiv.classList.add('hidden');
        });
        // вкладки терминал/логи
        tabTerminal.addEventListener('click', () => {
            setActiveTab(tabTerminal, [tabTerminal, tabLogs]);
            terminalPane.classList.remove('hidden');
            logsPane.classList.add('hidden');
        });
        tabLogs.addEventListener('click', () => {
            setActiveTab(tabLogs, [tabTerminal, tabLogs]);
            logsPane.classList.remove('hidden');
            terminalPane.classList.add('hidden');
        });

        // Серво: слайдеры + обновление значений и отправка
        for (let ch = 0; ch <= 5; ch++) {
            const slider = document.getElementById(`servo${ch}`);
            if (slider) {
                const updateSpan = () => updateServoValue(ch, slider.value);
                slider.addEventListener('input', updateSpan);
                slider.addEventListener('change', () => setServo(ch, parseInt(slider.value)));
                updateSpan(); // инициализация
            }
        }

        // Camera controls (основной глаз, глубина, alpha)
        eyeLeft.addEventListener('change', () => updateRenderParams());
        eyeRight.addEventListener('change', () => updateRenderParams());
        showDepthChk.addEventListener('change', () => updateRenderParams());
        depthAlphaSlider.addEventListener('input', () => updateRenderParams());
        depthEnabledChk.addEventListener('change', () => sendCameraParams());
        wlsEnabledChk.addEventListener('change', () => sendCameraParams());

        // трекинг параметры
        trackingEnabledChk.addEventListener('change', () => sendCameraParams());
        trackingModeSelect.addEventListener('change', () => sendCameraParams());
        trackingScaleX.addEventListener('input', () => { updateTrackingDisplay(); sendCameraParams(); });
        trackingScaleY.addEventListener('input', () => { updateTrackingDisplay(); sendCameraParams(); });
        trackingOffsetX.addEventListener('input', () => { updateTrackingDisplay(); sendCameraParams(); });
        trackingOffsetY.addEventListener('input', () => { updateTrackingDisplay(); sendCameraParams(); });
        servoTrackingChk.addEventListener('change', () => setServoTracking());

        // терминал
        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = terminalInput.value.trim();
                if (cmd) sendTerminalCommand(cmd);
                terminalInput.value = '';
            }
        });
    }

    // Инициализация приложения
    async function initApp() {
        attachAllEventListeners();
        await loadCameraParams();
        await loadServoTrackingState();
        updateTrackingDisplay();
        await updateRenderParams();
        fetchSystemStats();
        fetchTerminalOutput();
        initDepthTooltip();
        setInterval(fetchSystemStats, 2200);
        setInterval(fetchTerminalOutput, 400);
        // начальное состояние: видео активно
        stopPointCloud();
        videoContainer.classList.remove('hidden');
        cloudContainer.classList.add('hidden');
    }

    initApp();
</script>
