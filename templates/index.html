<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>R2 — Главная | Управление роботом</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0a; --panel: #121212; --panel-2: #151515;
            --text: #f0f0f0; --muted: #9c9c9c; --line: #2a2a2a;
            --accent: #44944a; --danger: #8b0000; --cam-w: 960px; --cam-h: 540px;
        }
        html, body { height: 100%; background: var(--bg); }
        body { overflow: hidden; color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        .layout { width: 100%; height: 100vh; display: flex; flex-direction: column; gap: 12px; overflow: hidden; padding: 16px; }
        .topbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; flex-shrink: 0; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { color: var(--text); text-decoration: none; border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .nav-links a:hover { background: #1f1f1f; border-color: #3a3a3a; }
        .stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .stats div { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; background: var(--panel); }
        .stats span { color: var(--text); font-weight: 600; margin-left: 4px; }
        .container { display: grid; grid-template-columns: 260px minmax(0, var(--cam-w)) 1fr; gap: 14px; flex: 1; min-height: 0; overflow: hidden; }
        .panel { border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .panel-title { font-size: 11px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }
        .terminal-box { flex: 1; border-radius: 14px; border: 1px solid var(--line); background: #0d0d0d; padding: 12px; overflow-y: auto; font-size: 12px; line-height: 1.45; white-space: pre-wrap; font-family: 'JetBrains Mono', Consolas, monospace; color: #e0e0e0; }
        .tabs { display: flex; gap: 6px; margin-bottom: 10px; padding: 4px; border-radius: 40px; background: rgba(20, 20, 20, 0.8); border: 1px solid var(--line); width: 100%; }
        .tabs button { cursor: pointer; border: none; border-radius: 30px; padding: 6px 14px; font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; transition: 0.2s; flex: 1; text-align: center; }
        .tabs button.active { color: white; background: #44944a; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        #video-container { width: 100%; height: var(--cam-h); position: relative; border-radius: 16px; border: 1px solid var(--line); background: #070707; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; }
        .depth-tooltip { position: absolute; background: #111; color: white; border: 1px solid #3a3a3a; border-radius: 12px; padding: 5px 10px; font-size: 12px; font-weight: 500; pointer-events: none; z-index: 1000; }
        .hidden { display: none !important; }
        .servo-controls { overflow-y: auto; flex: 1; padding-right: 6px; }
        .servo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .servo-row label { width: 100px; font-size: 11.5px; color: var(--muted); }
        .servo-row input[type="range"] { flex: 1; accent-color: #44944a; }
        .servo-row span { width: 45px; text-align: right; font-size: 11px; font-weight: 500; color: #ddd; }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 0px; margin-bottom: 12px; flex-wrap: wrap; }
        .control-row label { font-size: 12px; color: var(--muted); }
        input[type="checkbox"], input[type="radio"] { accent-color: #44944a; width: 16px; height: 16px; margin-right: 6px; }
        select, input[type="range"] { background: #1e1e1e; border: 1px solid var(--line); color: white; border-radius: 8px; padding: 6px 8px; accent-color: #44944a; }
        .exit-btn { background: var(--danger); color: white; border: none; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .exit-btn.confirming { background: #cc0000; animation: pulse 0.5s infinite alternate; }
        .exit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        .update-btn { background: #1e4a76; color: white; border: none; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .update-btn:hover { background: #2c6b9e; }
        .update-btn:disabled, .exit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #help-sidebar button.active { background:#44944a30; color:#44944a; }
        @media (max-width: 1280px) {
            .container { grid-template-columns: 1fr; overflow: auto; }
            body { overflow: auto; }
            .layout { height: auto; min-height: 100vh; }
            #video-container { width: 100%; height: auto; aspect-ratio: 16/9; }
            :root { --cam-h: auto; --cam-w: 100%; }
            .stats { justify-content: flex-start; }
            .topbar { grid-template-columns: 1fr; }
        }
        #help-content h1 { font-size:18px; color:#fff; margin-bottom:12px; }
        #help-content h2 { font-size:15px; color:#44944a; margin:18px 0 8px; }
        #help-content h3 { font-size:13px; color:#ddd; margin:14px 0 6px; }
        #help-content p { margin:6px 0; line-height:1.6; }
        #help-content code { background:#1a1a1a; color:#e6db74; padding:2px 5px; border-radius:4px; font-size:12px; }
        #help-content pre { background:#0d0d0d; border:1px solid #2a2a2a; border-radius:10px; padding:12px; overflow-x:auto; margin:10px 0; }
        #help-content pre code { background:none; color:#e0e0e0; padding:0; }
        #help-content table { width:100%; border-collapse:collapse; margin:10px 0; }
        #help-content th, #help-content td { border:1px solid #2a2a2a; padding:6px 10px; text-align:left; font-size:12px; }
        #help-content th { background:#1a1a1a; color:#44944a; }
        #help-content hr { border:none; border-top:1px solid #2a2a2a; margin:16px 0; }
        #help-content blockquote { border-left:3px solid #44944a; padding:6px 12px; margin:10px 0; background:#0f0f0f; border-radius:0 8px 8px 0; color:#aaa; }
        #help-content strong { color:#fff; }
        #ai-chat-log { flex:1; border-radius:14px; border:1px solid var(--line); background:#0d0d0d; padding:12px; overflow-y:auto; font-size:13px; line-height:1.5; font-family: 'JetBrains Mono', Consolas, monospace; display:flex; flex-direction:column; gap:6px; }
        .ai-msg { padding:6px 10px; border-radius:10px; max-width:95%; animation: fadeIn 0.15s ease-in; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
        .ai-msg-user { background:#1a2a1a; border:1px solid #2a3a2a; color:#b0e0b0; align-self:flex-end; border-bottom-right-radius:3px; }
        .ai-msg-think { background:#151520; border:1px solid #252535; color:#7a7a9a; font-style:italic; font-size:12px; border-bottom-left-radius:3px; }
        .ai-msg-think .ai-label { color:#5555aa; font-weight:600; font-style:normal; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
        .ai-msg-tool { background:#1a1510; border:1px solid #2a2520; color:#c0a060; font-size:11px; border-bottom-left-radius:3px; }
        .ai-msg-tool .ai-label { color:#aa8833; font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
        .ai-msg-answer { background:#101a15; border:1px solid #1a2a22; color:#e0f0e8; font-size:13px; border-bottom-left-radius:3px; }
        .ai-msg-answer .ai-label { color:#44944a; font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
        .ai-msg-error { background:#201010; border:1px solid #301a1a; color:#e08080; border-bottom-left-radius:3px; }
        .ai-msg-error .ai-label { color:#aa4444; font-weight:600; font-size:10px; }
        .ai-msg-system { background:#101015; border:1px solid #1a1a25; color:#707088; font-size:11px; text-align:center; }
        #ai-status-bar { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:12px; background:#0d0d0d; font-size:11px; color:var(--muted); flex-shrink:0; margin-top:6px; }
        #ai-status-bar .dot { width:8px; height:8px; border-radius:50%; background:#555; flex-shrink:0; }
        #ai-status-bar .dot.thinking { background:#d19a66; animation: pulse 0.8s infinite alternate; }
        #ai-status-bar .dot.speaking { background:#44944a; animation: pulse 0.6s infinite alternate; }
        @media (max-width: 480px) {
            .layout { padding: 8px; gap: 8px; }
            .servo-row label { width: 70px; font-size: 10px; }
            .servo-row { gap: 4px; }
            .stats div { font-size: 10px; padding: 4px 8px; }
            .panel { padding: 10px; border-radius: 14px; }
            .nav-links a { padding: 6px 10px; font-size: 11px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.10/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/monokai.min.css">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/python/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/edit/closebrackets.min.js"></script>
</head>
<body>
<div class="layout">
    <header class="topbar">
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/file_manager">Файлы</a>
        </div>
        <div class="stats">
            <div>CPU: <span id="cpuStat">0</span>%</div>
            <div>RAM: <span id="ramStat">0</span>%</div>
            <div>Темп: <span id="tempStat">--</span></div>
            <div title="Сервер: захват+обработка">Серв: <span id="fpsStat">0</span></div>
            <div title="Сервер: кодирование+отправка">Стрим: <span id="streamFpsStat">0</span></div>
            <div title="Реальное разрешение камеры">Cam: <span id="camResStat">-</span></div>
            <button id="updateBtn" class="update-btn">↻</button>
            <button id="exitBtn" class="exit-btn">⏻</button>
        </div>
    </header>

    <div class="container">
        <aside class="panel">
            <div class="panel-title">Сервоприводы</div>
            <div class="servo-controls">
                <div class="servo-row"><label>(00) Шея:</label><input type="range" id="servo0" min="0" max="180" value="90"><span id="servo0_val">90°</span></div>
                <div class="servo-row"><label>(01) Пр. плечо:</label><input type="range" id="servo1" min="0" max="270" value="135"><span id="servo1_val">135°</span></div>
                <div class="servo-row"><label>(02) Лев. плечо:</label><input type="range" id="servo2" min="0" max="270" value="135"><span id="servo2_val">135°</span></div>
                <div class="servo-row"><label>(03) Наклон:</label><input type="range" id="servo3" min="0" max="180" value="90"><span id="servo3_val">90°</span></div>
                <div class="servo-row"><label>(04) Пов. пр.:</label><input type="range" id="servo4" min="0" max="270" value="45"><span id="servo4_val">45°</span></div>
                <div class="servo-row"><label>(05) Пов. лев.:</label><input type="range" id="servo5" min="0" max="270" value="45"><span id="servo5_val">45°</span></div>
                <div class="servo-row"><label>(06) Пр. локоть:</label><input type="range" id="servo6" min="0" max="270" value="135"><span id="servo6_val">135°</span></div>
                <div class="servo-row"><label>(07) Лев. локоть:</label><input type="range" id="servo7" min="0" max="270" value="135"><span id="servo7_val">135°</span></div>
                <div class="servo-row"><label>(08) Пр. захват:</label><input type="range" id="servo8" min="0" max="180" value="90"><span id="servo8_val">90°</span></div>
                <div class="servo-row"><label>(09) Лев. захват:</label><input type="range" id="servo9" min="0" max="180" value="90"><span id="servo9_val">90°</span></div>
            </div>
        </aside>

        <main class="panel" style="display: flex; flex-direction: column; align-items: center;">
            <div id="video-container">
                <img id="video-feed" src="/video_feed" alt="Video Stream" crossorigin="anonymous">
                <div class="depth-tooltip hidden" id="depthTooltip">Загрузка...</div>
            </div>

            <div class="control-row" style="width:100%; margin-top: 12px;">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label>Основной глаз:</label>
                    <label><input type="radio" name="mainEye" id="eyeLeft" checked> Левый</label>
                    <label><input type="radio" name="mainEye" id="eyeRight"> Правый</label>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label>Прозрачность:</label>
                    <input type="range" id="depthAlpha" min="0" max="100" value="30" style="width:100px;">
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label><input type="checkbox" id="depthEnabled"> Глубина</label>
                    <label><input type="checkbox" id="hudEnabled"> HUD</label>
                    <label><input type="checkbox" id="wlsEnabled"> WLS</label>
                </div>
            </div>
        </main>

        <aside class="panel">
            <div class="tabs" id="rightTabs">
                <button id="tabTerminal" class="active">Терминал</button>
                <button id="tabLogs">Логи</button>
                <button id="tabPython">Python</button>
                <button id="tabAI">AI</button>
                <button id="tabHelp">Помощь</button>
            </div>
            <div id="terminal-pane" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div id="terminal-output" class="terminal-box"></div>
                <div style="display:flex; margin-top:8px; gap:8px; align-items:center; flex-shrink:0;">
                    <span style="color:#44944a; font-family: monospace;">❯</span>
                    <input type="text" id="terminal-command" placeholder="Введите команду..." style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius:12px; padding:8px 12px; font-family:monospace; outline:none; font-size:13px;">
                </div>
                <div id="ssh-info" style="margin-top:6px; padding:7px 12px; border:1px solid var(--line); border-radius:12px; background:#0d0d0d; font-size:12px; color:var(--muted); display:flex; gap:16px; align-items:center; flex-shrink:0;">
                    <span>🔒 SSH: <strong style="color:#fff;">orangepi@<span id="sshHostDisplay">--</span></strong></span>
                    <span>пароль: <strong style="color:#fff;">orangepi</strong></span>
                    <span style="font-size:11px; color:#555;">(порт 22)</span>
                </div>
            </div>
            <div id="logs-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div id="logs-output" class="terminal-box">📡 Логи загрузятся автоматически...</div>
            </div>
            <div id="python-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0; gap: 8px;">
                <div id="python-editor-wrap" style="flex:1; border:1px solid #2a2a2a; border-radius:12px; overflow:hidden;"><textarea id="python-code" style="display:none;">print("Hello, World!")
set_emote("happy")
speak("Привет, я робот R2!")</textarea></div>
                <div style="display: flex; gap: 8px;">
                    <button id="run-python-btn" style="flex:1; background: #44944a; color: white; border: none; border-radius: 12px; padding: 8px 16px; cursor: pointer;"><span class="loading-spinner hidden" id="python-spinner"></span>▶ Запустить</button>
                    <button id="clear-python-btn" style="background: #333; color: white; border: none; border-radius: 12px; padding: 8px 16px; cursor: pointer;">Очистить</button>
                </div>
                <div id="python-output" class="terminal-box" style="flex:1;"></div>
            </div>
            <div id="help-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0; gap:0;">
                <div style="display:flex; gap:8px; flex:1; min-height:0;">
                    <div id="help-sidebar" style="flex:0 0 140px; overflow-y:auto; border:1px solid var(--line); border-radius:14px; background:#0d0d0d; padding:6px 0;"></div>
                    <div id="help-content" class="terminal-box" style="flex:1; line-height:1.6; font-size:13px; overflow-y:auto;"></div>
                </div>
            </div>
            <div id="ai-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div id="ai-chat-log"></div>
                <div style="display:flex; margin-top:8px; gap:8px; align-items:center; flex-shrink:0;">
                    <span style="color:#44944a; font-family: monospace;">🤖</span>
                    <input type="text" id="ai-input" placeholder="Спроси робота..." style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius:12px; padding:8px 12px; font-family:monospace; outline:none; font-size:13px;">
                    <button id="ai-send-btn" style="background:#44944a; color:white; border:none; border-radius:12px; padding:8px 16px; cursor:pointer; font-size:13px; font-weight:500; white-space:nowrap;">Отправить</button>
                    <button id="ai-stop-btn" style="background:#8b0000; color:white; border:none; border-radius:12px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:500; white-space:nowrap; display:none;">Стоп</button>
                </div>
                <div id="ai-status-bar"><div class="dot" id="ai-dot"></div><span id="ai-status-text">Ожидание...</span></div>
            </div>
        </aside>
    </div>
</div>

<script>
const serverData = {
    camera_params: {{ camera_params | tojson }},
    servo_angles: {{ servo_angles | tojson }},
    servo_offsets: {{ servo_offsets | tojson }},
    current_emote: "{{ current_emote }}",
    eyes_position: {{ eyes_position | tojson }},
    supported_emotes: {{ supported_emotes | tojson }},
    system_data: {{ system_data | tojson }}
};

// ===================== DOM =====================
const videoFeed = document.getElementById('video-feed');
const depthTooltip = document.getElementById('depthTooltip');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');
const depthAlphaSlider = document.getElementById('depthAlpha');
const depthEnabledChk = document.getElementById('depthEnabled');
const hudEnabledChk = document.getElementById('hudEnabled');
const wlsEnabledChk = document.getElementById('wlsEnabled');
const terminalOutputDiv = document.getElementById('terminal-output');
const terminalInput = document.getElementById('terminal-command');
const sshHostDisplay = document.getElementById('sshHostDisplay');
const pythonEditorWrap = document.getElementById('python-editor-wrap');
const logsOutput = document.getElementById('logs-output');
const tabTerminal = document.getElementById('tabTerminal');
const tabLogs = document.getElementById('tabLogs');
const tabPython = document.getElementById('tabPython');
const tabHelp = document.getElementById('tabHelp');
const terminalPane = document.getElementById('terminal-pane');
const logsPane = document.getElementById('logs-pane');
const pythonPane = document.getElementById('python-pane');
const helpPane = document.getElementById('help-pane');
const helpSidebar = document.getElementById('help-sidebar');
const helpContent = document.getElementById('help-content');
const exitBtn = document.getElementById('exitBtn');
const updateBtn = document.getElementById('updateBtn');
const tabAI = document.getElementById('tabAI');
const aiPane = document.getElementById('ai-pane');
const aiChatLog = document.getElementById('ai-chat-log');
const aiInput = document.getElementById('ai-input');
const aiSendBtn = document.getElementById('ai-send-btn');
const aiStopBtn = document.getElementById('ai-stop-btn');
const aiDot = document.getElementById('ai-dot');
const aiStatusText = document.getElementById('ai-status-text');

// ===================== STATE RESTORE =====================
function restoreState() {
    if (serverData.camera_params) {
        const cp = serverData.camera_params;
        depthEnabledChk.checked = cp.depth_enabled || false;
        hudEnabledChk.checked = cp.hud_enabled || false;
        wlsEnabledChk.checked = cp.wls_enabled || false;
        depthAlphaSlider.value = (cp.alpha_depth || 0.3) * 100;
        eyeLeft.checked = cp.show_left !== false;
        eyeRight.checked = !eyeLeft.checked;
    }
    if (serverData.servo_angles) {
        Object.keys(serverData.servo_angles).forEach(ch => {
            const slider = document.getElementById(`servo${ch}`);
            if (slider) { slider.value = serverData.servo_angles[ch]; updateServoVal(ch, slider.value); }
        });
    }
    if (serverData.system_data) {
        const sd = serverData.system_data;
        document.getElementById('cpuStat').textContent = Math.round(sd.cpu || 0);
        document.getElementById('ramStat').textContent = Math.round(sd.ram || 0);
        document.getElementById('tempStat').textContent = sd.temp || '--';
        document.getElementById('fpsStat').textContent = (sd.fps || 0).toFixed(1);
        document.getElementById('streamFpsStat').textContent = sd.stream_fps ?? 0;
        document.getElementById('camResStat').textContent = (sd.cam_w || 0) + 'x' + (sd.cam_h || 0);
    }
}

// ===================== SERVO =====================
function updateServoVal(ch, val) {
    const s = document.getElementById(`servo${ch}_val`);
    if (s) s.textContent = val + '°';
}

async function setServo(ch, angle) {
    try { await fetch(`/api/servo/${ch}/${angle}`, {method:'POST'}); } catch(e) {}
}

for (let i=0; i<=9; i++) {
    const slider = document.getElementById(`servo${i}`);
    if (slider) {
        slider.addEventListener('input', () => updateServoVal(i, slider.value));
        slider.addEventListener('change', () => setServo(i, parseInt(slider.value)));
        updateServoVal(i, slider.value);
    }
}

// ===================== TERMINAL =====================
let lastTerminalOutput = '', fetchingTerminal = false, sendingCmd = false;
let cmdHistory = [];
let historyIdx = -1;

function ansiToHtml(text) {
    const styles = {
        '0': '',
        '1': 'font-weight:bold',
        '3': 'font-style:italic',
        '4': 'text-decoration:underline',
        '30': 'color:#000', '31': 'color:#e06c75', '32': 'color:#98c379',
        '33': 'color:#d19a66', '34': 'color:#61afef', '35': 'color:#c678dd',
        '36': 'color:#56b6c2', '37': 'color:#e0e0e0',
        '90': 'color:#666', '91': 'color:#ff6b6b', '92': 'color:#5cb85c',
        '93': 'color:#f0c040', '94': 'color:#5b9bd5', '95': 'color:#b080c0',
        '96': 'color:#50c0c0', '97': 'color:#fff',
    };
    // strip OSC sequences (ESC ] ... BEL|ST)
    text = text.replace(/\x1b\].*?(?:\x07|\x1b\\)/g, '');
    // strip non-SGR CSI sequences (ESC [ ... letter, but not ending in m)
    text = text.replace(/\x1b\[[0-9;?]*[a-ln-zA-LN-Z]/g, '');
    let html = text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let openCount = 0;
    html = html.replace(/\x1b\[([0-9;]*)m/g, (_, codes) => {
        if (!codes || codes === '0' || codes === '') {
            const out = '</span>'.repeat(openCount);
            openCount = 0;
            return out;
        }
        const parts = codes.split(';');
        let style = '';
        for (const c of parts) {
            if (styles[c]) style += styles[c] + ';';
        }
        if (style) {
            openCount++;
            return `<span style="${style}">`;
        }
        return '';
    });
    html += '</span>'.repeat(openCount);
    return html;
}

async function fetchTerminalOutput() {
    if (fetchingTerminal) return;
    fetchingTerminal = true;
    try {
        const r = await fetch('/api/cmd/output');
        const d = await r.json();
        if (d.output !== lastTerminalOutput) {
            terminalOutputDiv.innerHTML = ansiToHtml(d.output);
            terminalOutputDiv.scrollTop = terminalOutputDiv.scrollHeight;
            lastTerminalOutput = d.output;
        }
    } catch(e) {} finally { fetchingTerminal = false; }
}

async function sendTerminalCommand(cmd) {
    if (sendingCmd || !cmd.trim()) return;
    sendingCmd = true;
    cmdHistory.push(cmd.trim());
    historyIdx = cmdHistory.length;
    try {
        await fetch('/api/cmd/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd})});
        await fetchTerminalOutput();
    } catch(e) {} finally { sendingCmd = false; }
}

async function fetchSystemStats() {
    try {
        const r = await fetch('/api/data');
        const d = await r.json();
        document.getElementById('cpuStat').textContent = d.cpu ?? 0;
        document.getElementById('ramStat').textContent = d.ram ?? 0;
        document.getElementById('tempStat').textContent = d.temp ?? '--';
        document.getElementById('fpsStat').textContent = (d.fps ?? 0).toFixed(1);
        document.getElementById('streamFpsStat').textContent = d.stream_fps ?? 0;
        document.getElementById('camResStat').textContent = d.cam_w + 'x' + d.cam_h || '-';
        if (!logsPane.classList.contains('hidden')) {
            logsOutput.textContent = (d.logs || []).join('\n');
            logsOutput.scrollTop = logsOutput.scrollHeight;
        }
    } catch(e) {}
}

// ===================== EVENTS =====================
function attachEvents() {
    tabTerminal.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabTerminal.classList.add('active');
        terminalPane.classList.remove('hidden'); logsPane.classList.add('hidden'); pythonPane.classList.add('hidden'); helpPane.classList.add('hidden'); aiPane.classList.add('hidden');
    };
    tabLogs.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabLogs.classList.add('active');
        logsPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); pythonPane.classList.add('hidden'); helpPane.classList.add('hidden'); aiPane.classList.add('hidden');
        fetchSystemStats();
    };
    tabPython.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabPython.classList.add('active');
        pythonPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); logsPane.classList.add('hidden'); helpPane.classList.add('hidden'); aiPane.classList.add('hidden');
        if (!pythonEditor) initPythonEditor();
    };
    tabAI.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabAI.classList.add('active');
        aiPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); logsPane.classList.add('hidden'); pythonPane.classList.add('hidden'); helpPane.classList.add('hidden');
        aiChatLog.scrollTop = aiChatLog.scrollHeight;
        aiInput.focus();
    };
    tabHelp.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabHelp.classList.add('active');
        helpPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); logsPane.classList.add('hidden'); pythonPane.classList.add('hidden'); aiPane.classList.add('hidden');
        if (!helpSidebar.children.length) loadHelpFiles();
    };

    let currentHelpFile = '';

    async function loadHelpFiles() {
        helpSidebar.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:11px;">Загрузка...</div>';
        try {
            const r = await fetch('/api/help/files');
            const files = await r.json();
            helpSidebar.innerHTML = '';
            files.forEach(f => {
                const item = document.createElement('button');
                item.textContent = f.title;
                item.style = 'display:block; width:100%; background:none; border:none; color:var(--muted); text-align:left; padding:7px 10px; cursor:pointer; font-size:12px; border-radius:8px; transition:0.15s;';
                item.onmouseenter = () => { item.style.background = '#1a1a1a'; };
                item.onmouseleave = () => { if (currentHelpFile !== f.path) item.style.background = 'none'; };
                item.dataset.path = f.path;
                item.onclick = () => loadHelpDoc(f.path, item);
                helpSidebar.appendChild(item);
            });
            // open first doc
            if (files.length) {
                const first = helpSidebar.querySelector('button');
                loadHelpDoc(files[0].path, first);
            }
        } catch(e) {
            helpSidebar.innerHTML = '<div style="padding:10px;color:var(--danger);font-size:11px;">Ошибка: ' + e.message + '</div>';
        }
    }

    async function loadHelpDoc(path, btn) {
        helpContent.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);">Загрузка...</div>';
        helpSidebar.querySelectorAll('button').forEach(b => { b.style.background = 'none'; b.style.color = 'var(--muted)'; });
        if (btn) { btn.style.background = '#44944a30'; btn.style.color = '#44944a'; }
        currentHelpFile = path;
        try {
            const r = await fetch('/api/help?path=' + encodeURIComponent(path));
            const md = await r.text();
            helpContent.innerHTML = marked.parse(md);
            helpContent.scrollTop = 0;
            // open external links in new tab
            helpContent.querySelectorAll('a[href^="http"]').forEach(a => a.target = '_blank');
            // rewrite internal .md links to open in help
            helpContent.querySelectorAll('a[href$=".md"]').forEach(a => {
                const href = a.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    a.onclick = (e) => {
                        e.preventDefault();
                        const btn = helpSidebar.querySelector(`button[data-path="${href}"]`);
                        loadHelpDoc(href, btn || helpSidebar.querySelector('button'));
                    };
                }
            });
        } catch(e) {
            helpContent.innerHTML = '<div style="text-align:center;padding:30px;color:var(--danger);">Ошибка: ' + e.message + '</div>';
        }
    }

    eyeLeft.onchange = updateRenderParams;
    eyeRight.onchange = updateRenderParams;
    depthAlphaSlider.oninput = updateRenderParams;
    depthEnabledChk.onchange = sendCameraParams;
    hudEnabledChk.onchange = sendCameraParams;
    wlsEnabledChk.onchange = sendCameraParams;

    terminalInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
            sendTerminalCommand(terminalInput.value);
            terminalInput.value = '';
        } else if (e.key === 'Tab') {
            e.preventDefault();
            const start = terminalInput.selectionStart;
            terminalInput.value = terminalInput.value.slice(0, start) + '\t' + terminalInput.value.slice(terminalInput.selectionEnd);
            terminalInput.selectionStart = terminalInput.selectionEnd = start + 1;
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (cmdHistory.length && historyIdx > 0) {
                historyIdx--;
                terminalInput.value = cmdHistory[historyIdx];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIdx < cmdHistory.length - 1) {
                historyIdx++;
                terminalInput.value = cmdHistory[historyIdx];
            } else {
                historyIdx = cmdHistory.length;
                terminalInput.value = '';
            }
        }
    };

    // Init CodeMirror
    let pythonEditor = null;
    function initPythonEditor() {
        const ta = document.getElementById('python-code');
        if (!ta || pythonEditor) return;
        pythonEditor = CodeMirror.fromTextArea(ta, {
            mode: 'python',
            theme: 'monokai',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            matchBrackets: true,
            autoCloseBrackets: true,
            viewportMargin: Infinity,
        });
        pythonEditor.setSize(null, '100%');
    }

    // Python exec
    document.getElementById('run-python-btn').onclick = async () => {
        const code = pythonEditor ? pythonEditor.getValue() : document.getElementById('python-code').value;
        if (!code.trim()) return;
        const btn = document.getElementById('run-python-btn');
        const spinner = document.getElementById('python-spinner');
        const out = document.getElementById('python-output');
        btn.disabled = true; spinner.classList.remove('hidden');
        out.textContent = 'Выполнение...';
        try {
            const r = await fetch('/api/python/exec', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})});
            const d = await r.json();
            out.innerHTML = ((d.stdout||'') + ((d.stderr)?'\n--- ОШИБКИ ---\n'+d.stderr:'')).replace(/\n/g,'<br>') || '✓ Успешно';
            out.scrollTop = out.scrollHeight;
        } catch(e) { out.textContent = 'Ошибка: ' + e.message; }
        finally { btn.disabled = false; spinner.classList.add('hidden'); }
    };
    document.getElementById('clear-python-btn').onclick = () => {
        if (pythonEditor) pythonEditor.setValue('');
        else document.getElementById('python-code').value = '';
        document.getElementById('python-output').textContent = '';
    };

    // Shutdown confirmation
    let shutdownTimer = null;
    exitBtn.onclick = () => {
        if (shutdownTimer) {
            clearTimeout(shutdownTimer);
            shutdownTimer = null;
            performShutdown();
            return;
        }
        exitBtn.textContent = '⏻ Подтвердить';
        exitBtn.classList.add('confirming');
        shutdownTimer = setTimeout(() => {
            exitBtn.textContent = '⏻';
            exitBtn.classList.remove('confirming');
            shutdownTimer = null;
        }, 3000);
    };

    async function performShutdown() {
        exitBtn.disabled = true; exitBtn.textContent = '<span class="loading-spinner"></span> Выключение...';
        try {
            const r = await fetch('/api/shutdown', {method:'POST'});
            const d = await r.json();
            exitBtn.textContent = d.message || 'Выключение...';
        } catch(e) { alert('Ошибка при завершении'); exitBtn.disabled = false; exitBtn.textContent = '⏻'; exitBtn.classList.remove('confirming'); }
    }

    // Update
    updateBtn.onclick = async () => {
        updateBtn.disabled = true; updateBtn.innerHTML = '<span class="loading-spinner"></span> Обновление...';
        try {
            const r = await fetch('/api/update', {method:'POST'});
            const d = await r.json();
            alert(d.message || 'Обновление запущено.');
        } catch(e) { alert('Ошибка: '+e.message); updateBtn.disabled = false; updateBtn.textContent = '↻'; }
    };

    aiSendBtn.onclick = () => { aiInput.focus(); };
    aiStopBtn.onclick = () => {};
}

// ===================== AI CHAT (outside attachEvents for scope) =====================
let aiSSE = null;
let aiThinkingEl = null;
let aiToolsEl = null;
let aiAnswerEl = null;
let aiHistory = [];
let aiHistoryIdx = -1;

function aiAddMsg(type, label, text) {
    const div = document.createElement('div');
    div.className = 'ai-msg ai-msg-' + type;
    if (label) div.innerHTML = '<span class="ai-label">' + label + '</span><br>';
    const content = document.createElement('span');
    content.textContent = text;
    div.appendChild(content);
    aiChatLog.appendChild(div);
    aiChatLog.scrollTop = aiChatLog.scrollHeight;
    return div;
}

function aiUpdateOrCreate(type, label, text, elRef) {
    if (!elRef) {
        elRef = aiAddMsg(type, label, text);
    } else {
        const content = elRef.querySelector('span:last-child') || elRef;
        content.textContent = text;
        aiChatLog.scrollTop = aiChatLog.scrollHeight;
    }
    return elRef;
}

function aiSetStatus(state, text) {
    aiDot.className = 'dot' + (state === 'thinking' ? ' thinking' : state === 'speaking' ? ' speaking' : '');
    aiStatusText.textContent = text || 'Ожидание...';
    if (state === 'thinking' || state === 'speaking') {
        aiSendBtn.style.display = 'none';
        aiStopBtn.style.display = '';
    } else {
        aiSendBtn.style.display = '';
        aiStopBtn.style.display = 'none';
    }
}

function aiConnectSSE() {
    if (aiSSE) aiSSE.close();
    aiSSE = new EventSource('/api/ai/stream');
    aiSSE.onmessage = (e) => {
        try {
            const d = JSON.parse(e.data);
            if (d.is_idle && !d.is_thinking && !d.is_speaking) {
                aiSetStatus('idle', 'Ожидание...');
                aiThinkingEl = null; aiToolsEl = null;
                return;
            }
            if (d.is_thinking) {
                aiSetStatus('thinking', 'Рассуждает...');
                if (d.reasoning_text) {
                    aiThinkingEl = aiUpdateOrCreate('think', 'Рассуждение', d.reasoning_text, aiThinkingEl);
                }
            }
            if (d.tools_text) {
                aiToolsEl = aiUpdateOrCreate('tool', 'Инструменты', d.tools_text, aiToolsEl);
            }
            if (d.is_speaking) {
                aiSetStatus('speaking', 'Говорит...');
                if (d.last_answer && !aiAnswerEl) {
                    aiAnswerEl = aiAddMsg('answer', 'R2', d.last_answer);
                }
            }
            if (!d.is_thinking && !d.is_speaking && !d.is_idle) {
                aiSetStatus('thinking', 'Думаю...');
            }
        } catch(err) {}
    };
    aiSSE.onerror = () => {
        setTimeout(aiConnectSSE, 3000);
    };
}

async function aiSend(prompt) {
    if (!prompt.trim()) return;
    aiAddMsg('user', 'Вы', prompt);
    aiThinkingEl = null; aiToolsEl = null; aiAnswerEl = null;
    aiSetStatus('thinking', 'Отправляю...');
    try {
        const r = await fetch('/api/ai/command', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt})});
        const d = await r.json();
        if (d.error) aiAddMsg('error', 'Ошибка', d.error);
    } catch(e) { aiAddMsg('error', 'Ошибка', e.message); }
}

async function aiStop() {
    try { await fetch('/api/ai/stop', {method:'POST'}); } catch(e) {}
    aiSetStatus('idle', 'Остановлен');
    aiThinkingEl = null; aiToolsEl = null; aiAnswerEl = null;
}

aiSendBtn.onclick = () => {
    if (aiInput.value.trim()) { aiHistory.push(aiInput.value.trim()); aiHistoryIdx = aiHistory.length; }
    aiSend(aiInput.value); aiInput.value = '';
};
aiStopBtn.onclick = aiStop;

aiInput.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (aiInput.value.trim()) { aiHistory.push(aiInput.value.trim()); aiHistoryIdx = aiHistory.length; }
        aiSend(aiInput.value);
        aiInput.value = '';
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (aiHistory.length && aiHistoryIdx > 0) { aiHistoryIdx--; aiInput.value = aiHistory[aiHistoryIdx]; }
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (aiHistoryIdx < aiHistory.length - 1) { aiHistoryIdx++; aiInput.value = aiHistory[aiHistoryIdx]; }
        else { aiHistoryIdx = aiHistory.length; aiInput.value = ''; }
    }
};

// ===================== INIT =====================
async function init() {
    attachEvents();
    restoreState();
    await updateRenderParams();
    // Set SSH host from window location
    sshHostDisplay.textContent = location.hostname;

    fetchSystemStats();
    fetchTerminalOutput();
    setInterval(fetchSystemStats, 2200);
    setInterval(fetchTerminalOutput, 400);
    aiConnectSSE();

    // Poll for AI answer display (SSE may not always carry the final answer)
    setInterval(async () => {
        if (aiPane.classList.contains('hidden')) return;
        if (aiAnswerEl) return;
        try {
            const r = await fetch('/api/ai/status');
            const d = await r.json();
            if (d.last_answer && d.last_answer_time) {
                aiAnswerEl = aiAddMsg('answer', 'R2', d.last_answer);
                aiAnswerEl.dataset.ts = String(d.last_answer_time);
            }
        } catch(e) {}
    }, 1000);
}
init();
