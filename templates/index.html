<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>R2 — Главная | Управление роботом</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0a; --panel: #121212; --panel-2: #151515;
            --text: #f0f0f0; --muted: #9c9c9c; --line: #2a2a2a;
            --accent: #44944a; --danger: #8b0000; --cam-w: 960px; --cam-h: 540px;
        }
        html, body { height: 100%; background: var(--bg); }
        body { overflow: hidden; color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        .layout { width: 100%; height: 100vh; display: flex; flex-direction: column; gap: 12px; overflow: hidden; padding: 16px; }
        .topbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; flex-shrink: 0; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { color: var(--text); text-decoration: none; border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .nav-links a:hover { background: #1f1f1f; border-color: #3a3a3a; }
        .stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .stats div { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; background: var(--panel); }
        .stats span { color: var(--text); font-weight: 600; margin-left: 4px; }
        .container { display: grid; grid-template-columns: 260px minmax(0, var(--cam-w)) 1fr; gap: 14px; flex: 1; min-height: 0; overflow: hidden; }
        .panel { border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .panel-title { font-size: 11px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }
        .terminal-box { flex: 1; border-radius: 14px; border: 1px solid var(--line); background: #0d0d0d; padding: 12px; overflow-y: auto; font-size: 12px; line-height: 1.45; white-space: pre-wrap; font-family: 'JetBrains Mono', Consolas, monospace; color: #e0e0e0; }
        .tabs { display: flex; gap: 6px; margin-bottom: 10px; padding: 4px; border-radius: 40px; background: rgba(20, 20, 20, 0.8); border: 1px solid var(--line); width: 100%; }
        .tabs button { cursor: pointer; border: none; border-radius: 30px; padding: 6px 14px; font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; transition: 0.2s; flex: 1; text-align: center; }
        .tabs button.active { color: white; background: #44944a; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        #video-container { width: 100%; height: var(--cam-h); position: relative; border-radius: 16px; border: 1px solid var(--line); background: #070707; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; }
        .depth-tooltip { position: absolute; background: #111; color: white; border: 1px solid #3a3a3a; border-radius: 12px; padding: 5px 10px; font-size: 12px; font-weight: 500; pointer-events: none; z-index: 1000; }
        .hidden { display: none !important; }
        .servo-controls { overflow-y: auto; flex: 1; padding-right: 6px; }
        .servo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .servo-row label { width: 100px; font-size: 11.5px; color: var(--muted); }
        .servo-row input[type="range"] { flex: 1; accent-color: #44944a; }
        .servo-row span { width: 45px; text-align: right; font-size: 11px; font-weight: 500; color: #ddd; }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 0px; margin-bottom: 12px; flex-wrap: wrap; }
        .control-row label { font-size: 12px; color: var(--muted); }
        input[type="checkbox"], input[type="radio"] { accent-color: #44944a; width: 16px; height: 16px; margin-right: 6px; }
        select, input[type="range"] { background: #1e1e1e; border: 1px solid var(--line); color: white; border-radius: 8px; padding: 6px 8px; accent-color: #44944a; }
        .exit-btn { background: var(--danger); color: white; border: none; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .exit-btn.confirming { background: #cc0000; animation: pulse 0.5s infinite alternate; }
        .exit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        .update-btn { background: #1e4a76; color: white; border: none; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .update-btn:hover { background: #2c6b9e; }
        .update-btn:disabled, .exit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 1280px) {
            .container { grid-template-columns: 1fr; overflow: auto; }
            body { overflow: auto; }
            .layout { height: auto; min-height: 100vh; }
            #video-container { width: 100%; height: auto; aspect-ratio: 16/9; }
            :root { --cam-h: auto; --cam-w: 100%; }
            .stats { justify-content: flex-start; }
            .topbar { grid-template-columns: 1fr; }
        }
        #help-content h1 { font-size:18px; color:#fff; margin-bottom:12px; }
        #help-content h2 { font-size:15px; color:#44944a; margin:18px 0 8px; }
        #help-content h3 { font-size:13px; color:#ddd; margin:14px 0 6px; }
        #help-content p { margin:6px 0; line-height:1.6; }
        #help-content code { background:#1a1a1a; color:#e6db74; padding:2px 5px; border-radius:4px; font-size:12px; }
        #help-content pre { background:#0d0d0d; border:1px solid #2a2a2a; border-radius:10px; padding:12px; overflow-x:auto; margin:10px 0; }
        #help-content pre code { background:none; color:#e0e0e0; padding:0; }
        #help-content table { width:100%; border-collapse:collapse; margin:10px 0; }
        #help-content th, #help-content td { border:1px solid #2a2a2a; padding:6px 10px; text-align:left; font-size:12px; }
        #help-content th { background:#1a1a1a; color:#44944a; }
        #help-content hr { border:none; border-top:1px solid #2a2a2a; margin:16px 0; }
        #help-content blockquote { border-left:3px solid #44944a; padding:6px 12px; margin:10px 0; background:#0f0f0f; border-radius:0 8px 8px 0; color:#aaa; }
        #help-content strong { color:#fff; }
        @media (max-width: 480px) {
            .layout { padding: 8px; gap: 8px; }
            .servo-row label { width: 70px; font-size: 10px; }
            .servo-row { gap: 4px; }
            .stats div { font-size: 10px; padding: 4px 8px; }
            .panel { padding: 10px; border-radius: 14px; }
            .nav-links a { padding: 6px 10px; font-size: 11px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
</head>
<body>
<div class="layout">
    <header class="topbar">
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/file_manager">Файлы</a>
        </div>
        <div class="stats">
            <div>CPU: <span id="cpuStat">0</span>%</div>
            <div>RAM: <span id="ramStat">0</span>%</div>
            <div>Темп: <span id="tempStat">--</span></div>
            <div title="Сервер: захват+обработка">Серв: <span id="fpsStat">0</span></div>
            <div title="Сервер: кодирование+отправка">Стрим: <span id="streamFpsStat">0</span></div>
            <div title="Реальное разрешение камеры">Cam: <span id="camResStat">-</span></div>
            <button id="updateBtn" class="update-btn">↻</button>
            <button id="exitBtn" class="exit-btn">⏻</button>
        </div>
    </header>

    <div class="container">
        <aside class="panel">
            <div class="panel-title">Сервоприводы</div>
            <div class="servo-controls">
                <div class="servo-row"><label>(00) Шея:</label><input type="range" id="servo0" min="0" max="180" value="90"><span id="servo0_val">90°</span></div>
                <div class="servo-row"><label>(01) Пр. плечо:</label><input type="range" id="servo1" min="0" max="270" value="135"><span id="servo1_val">135°</span></div>
                <div class="servo-row"><label>(02) Лев. плечо:</label><input type="range" id="servo2" min="0" max="270" value="135"><span id="servo2_val">135°</span></div>
                <div class="servo-row"><label>(03) Наклон:</label><input type="range" id="servo3" min="0" max="180" value="90"><span id="servo3_val">90°</span></div>
                <div class="servo-row"><label>(04) Пов. пр.:</label><input type="range" id="servo4" min="0" max="270" value="45"><span id="servo4_val">45°</span></div>
                <div class="servo-row"><label>(05) Пов. лев.:</label><input type="range" id="servo5" min="0" max="270" value="45"><span id="servo5_val">45°</span></div>
                <div class="servo-row"><label>(06) Пр. локоть:</label><input type="range" id="servo6" min="0" max="270" value="135"><span id="servo6_val">135°</span></div>
                <div class="servo-row"><label>(07) Лев. локоть:</label><input type="range" id="servo7" min="0" max="270" value="135"><span id="servo7_val">135°</span></div>
                <div class="servo-row"><label>(08) Пр. захват:</label><input type="range" id="servo8" min="0" max="180" value="90"><span id="servo8_val">90°</span></div>
                <div class="servo-row"><label>(09) Лев. захват:</label><input type="range" id="servo9" min="0" max="180" value="90"><span id="servo9_val">90°</span></div>
            </div>
        </aside>

        <main class="panel" style="display: flex; flex-direction: column; align-items: center;">
            <div id="video-container">
                <img id="video-feed" src="/video_feed" alt="Video Stream" crossorigin="anonymous">
                <div class="depth-tooltip hidden" id="depthTooltip">Загрузка...</div>
            </div>

            <div class="control-row" style="width:100%; margin-top: 12px;">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label>Основной глаз:</label>
                    <label><input type="radio" name="mainEye" id="eyeLeft" checked> Левый</label>
                    <label><input type="radio" name="mainEye" id="eyeRight"> Правый</label>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label>Прозрачность:</label>
                    <input type="range" id="depthAlpha" min="0" max="100" value="30" style="width:100px;">
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label><input type="checkbox" id="depthEnabled"> Глубина</label>
                    <label><input type="checkbox" id="hudEnabled"> HUD</label>
                    <label><input type="checkbox" id="wlsEnabled"> WLS</label>
                </div>
            </div>
        </main>

        <aside class="panel">
            <div class="tabs" id="rightTabs">
                <button id="tabTerminal" class="active">Терминал</button>
                <button id="tabLogs">Логи</button>
                <button id="tabPython">Python</button>
                <button id="tabHelp">Помощь</button>
            </div>
            <div id="terminal-pane" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-shrink:0;">
                    <button id="termLocalBtn" class="term-mode-btn" style="flex:1; cursor:pointer; border:none; border-radius:30px; padding:5px 12px; font-size:12px; font-weight:500; background:#44944a; color:white;">Локальный</button>
                    <button id="termSshBtn" class="term-mode-btn" style="flex:1; cursor:pointer; border:none; border-radius:30px; padding:5px 12px; font-size:12px; font-weight:500; background:transparent; color:var(--muted);">SSH</button>
                    <div style="flex:1;"></div>
                    <span id="termStatus" style="font-size:11px; color:var(--muted); white-space:nowrap;">○ Откл</span>
                </div>
                <div id="termSshForm" class="hidden" style="display:flex; flex-direction:column; gap:5px; margin-bottom:6px; flex-shrink:0;">
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="sshHost" placeholder="Хост" style="flex:2; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius:8px; padding:5px 8px; font-family:monospace; outline:none; font-size:12px;">
                        <input type="number" id="sshPort" placeholder="22" value="22" style="flex:0 0 60px; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius:8px; padding:5px 8px; font-family:monospace; outline:none; font-size:12px;">
                    </div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="sshUser" placeholder="Пользователь" style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius:8px; padding:5px 8px; font-family:monospace; outline:none; font-size:12px;">
                        <input type="password" id="sshPass" placeholder="Пароль" style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius:8px; padding:5px 8px; font-family:monospace; outline:none; font-size:12px;">
                        <button id="sshConnectBtn" style="background:#44944a; color:white; border:none; border-radius:8px; padding:5px 12px; cursor:pointer; font-size:12px; font-weight:500;">→</button>
                    </div>
                </div>
                <div id="terminal-container" style="flex:1; border-radius:14px; border:1px solid var(--line); overflow:hidden;"></div>
            </div>
            <div id="logs-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div id="logs-output" class="terminal-box">📡 Логи загрузятся автоматически...</div>
            </div>
            <div id="python-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0; gap: 8px;">
                <textarea id="python-code" style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius: 12px; padding: 12px; font-family: monospace; resize: none; outline: none;" placeholder="Введите Python код...">print("Hello from Python tab!")</textarea>
                <div style="display: flex; gap: 8px;">
                    <button id="run-python-btn" style="flex:1; background: #44944a; color: white; border: none; border-radius: 12px; padding: 8px 16px; cursor: pointer;"><span class="loading-spinner hidden" id="python-spinner"></span>▶ Запустить</button>
                    <button id="clear-python-btn" style="background: #333; color: white; border: none; border-radius: 12px; padding: 8px 16px; cursor: pointer;">Очистить</button>
                </div>
                <div id="python-output" class="terminal-box" style="flex:1;"></div>
            </div>
            <div id="help-pane" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0; gap:0;">
                <div id="help-content" class="terminal-box" style="line-height:1.6; font-size:13px;"></div>
            </div>
        </aside>
    </div>
</div>

<script>
const serverData = {
    camera_params: {{ camera_params | tojson }},
    servo_angles: {{ servo_angles | tojson }},
    servo_offsets: {{ servo_offsets | tojson }},
    current_emote: "{{ current_emote }}",
    eyes_position: {{ eyes_position | tojson }},
    supported_emotes: {{ supported_emotes | tojson }},
    system_data: {{ system_data | tojson }}
};

// ===================== DOM =====================
const videoFeed = document.getElementById('video-feed');
const depthTooltip = document.getElementById('depthTooltip');
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');
const depthAlphaSlider = document.getElementById('depthAlpha');
const depthEnabledChk = document.getElementById('depthEnabled');
const hudEnabledChk = document.getElementById('hudEnabled');
const wlsEnabledChk = document.getElementById('wlsEnabled');
const terminalContainer = document.getElementById('terminal-container');
const logsOutput = document.getElementById('logs-output');
const tabTerminal = document.getElementById('tabTerminal');
const tabLogs = document.getElementById('tabLogs');
const tabPython = document.getElementById('tabPython');
const tabHelp = document.getElementById('tabHelp');
const terminalPane = document.getElementById('terminal-pane');
const logsPane = document.getElementById('logs-pane');
const pythonPane = document.getElementById('python-pane');
const helpPane = document.getElementById('help-pane');
const helpContent = document.getElementById('help-content');
const exitBtn = document.getElementById('exitBtn');
const updateBtn = document.getElementById('updateBtn');

// ===================== STATE RESTORE =====================
function restoreState() {
    if (serverData.camera_params) {
        const cp = serverData.camera_params;
        depthEnabledChk.checked = cp.depth_enabled || false;
        hudEnabledChk.checked = cp.hud_enabled || false;
        wlsEnabledChk.checked = cp.wls_enabled || false;
        depthAlphaSlider.value = (cp.alpha_depth || 0.3) * 100;
        eyeLeft.checked = cp.show_left !== false;
        eyeRight.checked = !eyeLeft.checked;
    }
    if (serverData.servo_angles) {
        Object.keys(serverData.servo_angles).forEach(ch => {
            const slider = document.getElementById(`servo${ch}`);
            if (slider) { slider.value = serverData.servo_angles[ch]; updateServoVal(ch, slider.value); }
        });
    }
    if (serverData.system_data) {
        const sd = serverData.system_data;
        document.getElementById('cpuStat').textContent = Math.round(sd.cpu || 0);
        document.getElementById('ramStat').textContent = Math.round(sd.ram || 0);
        document.getElementById('tempStat').textContent = sd.temp || '--';
        document.getElementById('fpsStat').textContent = (sd.fps || 0).toFixed(1);
        document.getElementById('streamFpsStat').textContent = sd.stream_fps ?? 0;
        document.getElementById('camResStat').textContent = (sd.cam_w || 0) + 'x' + (sd.cam_h || 0);
    }
}

// ===================== SERVO =====================
function updateServoVal(ch, val) {
    const s = document.getElementById(`servo${ch}_val`);
    if (s) s.textContent = val + '°';
}

async function setServo(ch, angle) {
    try { await fetch(`/api/servo/${ch}/${angle}`, {method:'POST'}); } catch(e) {}
}

for (let i=0; i<=9; i++) {
    const slider = document.getElementById(`servo${i}`);
    if (slider) {
        slider.addEventListener('input', () => updateServoVal(i, slider.value));
        slider.addEventListener('change', () => setServo(i, parseInt(slider.value)));
        updateServoVal(i, slider.value);
    }
}

// ===================== CAMERA =====================
async function sendCameraParams() {
    try {
        await fetch('/api/camera/params', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
            depth_enabled: depthEnabledChk.checked,
            hud_enabled: hudEnabledChk.checked,
            wls_enabled: wlsEnabledChk.checked,
        })});
    } catch(e) {}
}

async function updateRenderParams() {
    try {
        await fetch('/update', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({alpha_depth: parseInt(depthAlphaSlider.value), show_left: eyeLeft.checked, num_disp: 5})});
    } catch(e) {}
}

// ===================== TERMINAL (xterm.js + WebSocket) =====================
const term = new Terminal({
    cursorBlink: true,
    cursorStyle: 'block',
    fontSize: 13,
    fontFamily: "'JetBrains Mono', Consolas, monospace",
    theme: { background: '#0d0d0d', foreground: '#e0e0e0', cursor: '#44944a', selectionBackground: '#44944a40' },
    cols: 80, rows: 24,
    allowTransparency: false,
    scrollback: 10000,
});
let termWs = null;
let termMode = 'local';
let termConnected = false;

function termOpen() {
    const container = document.getElementById('terminal-container');
    if (container && !term.element) {
        term.open(container);
        term.focus();
        term.onData(data => {
            if (termWs && termWs.readyState === WebSocket.OPEN) {
                termWs.send(JSON.stringify({type: 'input', data}));
            }
        });
        term.onResize(({cols, rows}) => {
            if (termWs && termWs.readyState === WebSocket.OPEN) {
                termWs.send(JSON.stringify({type: 'resize', cols, rows}));
            }
        });
    }
}

function termConnect(mode, sshOpts) {
    if (termWs) { termWs.close(); termWs = null; }
    termConnected = false;
    document.getElementById('termStatus').textContent = '○ Подкл...';

    termWs = new WebSocket(`ws://${location.hostname}:8765/`);
    termWs.onopen = () => {
        const msg = {type: 'connect', mode};
        if (mode === 'ssh') {
            Object.assign(msg, sshOpts);
        }
        termWs.send(JSON.stringify(msg));
    };
    termWs.onmessage = (e) => {
        try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'connected') {
                termConnected = true;
                document.getElementById('termStatus').textContent = '● ' + (mode === 'ssh' ? sshOpts.host : 'Локальный');
                term.clear();
            } else if (msg.type === 'output') {
                term.write(msg.data);
            }
        } catch(_) {
            term.write(e.data);
        }
    };
    termWs.onclose = () => {
        termConnected = false;
        document.getElementById('termStatus').textContent = '○ Откл';
        if (termWs) { termWs = null; }
        term.write('\r\n\x1b[33m[Соединение закрыто]\x1b[0m\r\n');
    };
    termWs.onerror = () => {
        termConnected = false;
        document.getElementById('termStatus').textContent = '✕ Ошибка';
    };
}

function termDisconnect() {
    if (termWs) {
        termWs.send(JSON.stringify({type: 'disconnect'}));
        termWs.close();
        termWs = null;
    }
    termConnected = false;
    document.getElementById('termStatus').textContent = '○ Откл';
}

function termSetMode(mode) {
    termMode = mode;
    termDisconnect();
    document.querySelectorAll('.term-mode-btn').forEach(b => {
        b.style.background = 'transparent';
        b.style.color = 'var(--muted)';
    });
    const btn = mode === 'local' ? document.getElementById('termLocalBtn') : document.getElementById('termSshBtn');
    btn.style.background = '#44944a';
    btn.style.color = 'white';
    document.getElementById('termSshForm').classList.toggle('hidden', mode !== 'ssh');
    if (mode === 'local') {
        termConnect('local');
    }
}

// ===================== STATS =====================
async function fetchSystemStats() {
    try {
        const r = await fetch('/api/data');
        const d = await r.json();
        document.getElementById('cpuStat').textContent = d.cpu ?? 0;
        document.getElementById('ramStat').textContent = d.ram ?? 0;
        document.getElementById('tempStat').textContent = d.temp ?? '--';
        document.getElementById('fpsStat').textContent = (d.fps ?? 0).toFixed(1);
        document.getElementById('streamFpsStat').textContent = d.stream_fps ?? 0;
        document.getElementById('camResStat').textContent = d.cam_w + 'x' + d.cam_h || '-';
        if (!logsPane.classList.contains('hidden')) {
            logsOutput.textContent = (d.logs || []).join('\n');
            logsOutput.scrollTop = logsOutput.scrollHeight;
        }
    } catch(e) {}
}

// ===================== EVENTS =====================
function attachEvents() {
    tabTerminal.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabTerminal.classList.add('active');
        terminalPane.classList.remove('hidden'); logsPane.classList.add('hidden'); pythonPane.classList.add('hidden'); helpPane.classList.add('hidden');
    };
    tabLogs.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabLogs.classList.add('active');
        logsPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); pythonPane.classList.add('hidden'); helpPane.classList.add('hidden');
        fetchSystemStats();
    };
    tabPython.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabPython.classList.add('active');
        pythonPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); logsPane.classList.add('hidden'); helpPane.classList.add('hidden');
    };
    tabHelp.onclick = () => {
        document.querySelectorAll('#rightTabs button').forEach(b => b.classList.remove('active'));
        tabHelp.classList.add('active');
        helpPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); logsPane.classList.add('hidden'); pythonPane.classList.add('hidden');
        loadHelpContent();
    };

    let helpLoaded = false;
    async function loadHelpContent() {
        if (helpLoaded) return;
        helpContent.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);">Загрузка справки...</div>';
        try {
            const r = await fetch('/api/help');
            helpContent.innerHTML = await r.text();
            helpContent.scrollTop = 0;
            helpLoaded = true;
        } catch(e) {
            helpContent.innerHTML = '<div style="text-align:center;padding:30px;color:var(--danger);">Ошибка загрузки справки: ' + e.message + '</div>';
        }
    }

    eyeLeft.onchange = updateRenderParams;
    eyeRight.onchange = updateRenderParams;
    depthAlphaSlider.oninput = updateRenderParams;
    depthEnabledChk.onchange = sendCameraParams;
    hudEnabledChk.onchange = sendCameraParams;
    wlsEnabledChk.onchange = sendCameraParams;

    document.getElementById('termLocalBtn').onclick = () => termSetMode('local');
    document.getElementById('termSshBtn').onclick = () => termSetMode('ssh');
    document.getElementById('sshConnectBtn').onclick = () => {
        const host = document.getElementById('sshHost').value.trim();
        if (!host) return;
        termConnect('ssh', {
            host,
            port: parseInt(document.getElementById('sshPort').value) || 22,
            user: document.getElementById('sshUser').value.trim() || 'root',
            password: document.getElementById('sshPass').value,
        });
    };
    // Enter in SSH password field also connects
    document.getElementById('sshPass').onkeydown = (e) => {
        if (e.key === 'Enter') document.getElementById('sshConnectBtn').click();
    };

    // Ensure terminal container exists and open xterm
    setTimeout(termOpen, 100);

    // Python exec
    document.getElementById('run-python-btn').onclick = async () => {
        const code = document.getElementById('python-code').value;
        if (!code.trim()) return;
        const btn = document.getElementById('run-python-btn');
        const spinner = document.getElementById('python-spinner');
        const out = document.getElementById('python-output');
        btn.disabled = true; spinner.classList.remove('hidden');
        out.textContent = 'Выполнение...';
        try {
            const r = await fetch('/api/python/exec', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})});
            const d = await r.json();
            out.textContent = (d.stdout||'') + ((d.stderr)?'\n--- ОШИБКИ ---\n'+d.stderr:'') || '✓ Успешно';
            out.scrollTop = out.scrollHeight;
        } catch(e) { out.textContent = 'Ошибка: ' + e.message; }
        finally { btn.disabled = false; spinner.classList.add('hidden'); }
    };
    document.getElementById('clear-python-btn').onclick = () => {
        document.getElementById('python-code').value = '';
        document.getElementById('python-output').textContent = '';
    };

    // Shutdown confirmation
    let shutdownTimer = null;
    exitBtn.onclick = () => {
        if (shutdownTimer) {
            clearTimeout(shutdownTimer);
            shutdownTimer = null;
            performShutdown();
            return;
        }
        exitBtn.textContent = '⏻ Подтвердить';
        exitBtn.classList.add('confirming');
        shutdownTimer = setTimeout(() => {
            exitBtn.textContent = '⏻';
            exitBtn.classList.remove('confirming');
            shutdownTimer = null;
        }, 3000);
    };

    async function performShutdown() {
        exitBtn.disabled = true; exitBtn.textContent = '<span class="loading-spinner"></span> Выключение...';
        try {
            const r = await fetch('/api/shutdown', {method:'POST'});
            const d = await r.json();
            exitBtn.textContent = d.message || 'Выключение...';
        } catch(e) { alert('Ошибка при завершении'); exitBtn.disabled = false; exitBtn.textContent = '⏻'; exitBtn.classList.remove('confirming'); }
    }

    // Update
    updateBtn.onclick = async () => {
        updateBtn.disabled = true; updateBtn.innerHTML = '<span class="loading-spinner"></span> Обновление...';
        try {
            const r = await fetch('/api/update', {method:'POST'});
            const d = await r.json();
            alert(d.message || 'Обновление запущено.');
        } catch(e) { alert('Ошибка: '+e.message); updateBtn.disabled = false; updateBtn.textContent = '↻'; }
    };
}

// ===================== INIT =====================
async function init() {
    attachEvents();
    restoreState();
    await updateRenderParams();
    fetchSystemStats();
    setInterval(fetchSystemStats, 2200);
}
init();
</script>
</body>
</html>
