<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>R2 — Главная | Управление роботом</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0a;
            --panel: #121212;
            --panel-2: #151515;
            --text: #f0f0f0;
            --muted: #9c9c9c;
            --line: #2a2a2a;
            --accent: #44944a;
            --cam-w: 853px;
            --cam-h: 480px;
        }

        html, body {
            height: 100%;
            background: var(--bg);
        }

        body {
            overflow: hidden;
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .layout {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            padding: 16px;
        }

        .topbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-links a:hover {
            background: #1f1f1f;
            border-color: #3a3a3a;
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .stats div {
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px 12px;
            background: var(--panel);
        }

        .stats span {
            color: var(--text);
            font-weight: 600;
            margin-left: 4px;
        }

        .container {
            display: grid;
            grid-template-columns: 260px minmax(0, var(--cam-w)) 1fr;
            gap: 14px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .panel {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .panel-title {
            font-size: 11px;
            letter-spacing: 1.2px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .terminal-box {
            flex: 1;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: #0d0d0d;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', Consolas, monospace;
            color: #e0e0e0;
        }

        .tabs {
            display: inline-flex;
            gap: 6px;
            margin-bottom: 10px;
            padding: 4px;
            border-radius: 40px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--line);
            align-self: flex-start;
        }

        .tabs button {
            cursor: pointer;
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            background: transparent;
            transition: 0.2s;
        }

        .tabs button.active {
            color: white;
            background: #44944a;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        #video-container, #mesh-container {
            width: var(--cam-w);
            height: var(--cam-h);
            flex-shrink: 0;
            position: relative;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: #070707;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-feed {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #mesh-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
        }

        .depth-tooltip {
            position: absolute;
            background: #111;
            color: white;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
            z-index: 1000;
        }

        .hidden {
            display: none !important;
        }

        .servo-controls {
            overflow-y: auto;
            flex: 1;
            padding-right: 6px;
        }

        .servo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .servo-row label {
            width: 100px;
            font-size: 11.5px;
            color: var(--muted);
        }

        .servo-row input[type="range"] {
            flex: 1;
            accent-color: #44944a;
        }

        .servo-row span {
            width: 45px;
            text-align: right;
            font-size: 11px;
            font-weight: 500;
            color: #ddd;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .control-row label {
            font-size: 12px;
            color: var(--muted);
        }

        input[type="checkbox"], input[type="radio"] {
            accent-color: #44944a;
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }

        select, input[type="range"] {
            background: #1e1e1e;
            border: 1px solid var(--line);
            color: white;
            border-radius: 8px;
            padding: 6px 8px;
            accent-color: #44944a;
        }

        .ai-live-block {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 12px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            transition: box-shadow 0.15s;
            font-family: 'JetBrains Mono', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid var(--line);
            overflow-y: auto;
        }

        .flash-green {
            box-shadow: 0 0 0 4px #44944a, 0 0 0 8px rgba(68, 148, 74, 0.4);
            transition: box-shadow 0.2s;
        }

        @media (max-width: 1280px) {
            .container {
                grid-template-columns: 1fr;
                overflow: auto;
            }
            body { overflow: auto; }
            .layout { height: auto; }
            #video-container, #mesh-container { width: 100%; }
        }

        .update-btn {
            background: #1e4a76;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .update-btn:hover {
            background: #2c6b9e;
        }
    </style>
</head>
<body>
<div class="layout">
    <header class="topbar">
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/screen">Экран</a>
        </div>
        <div class="stats">
            <div>CPU: <span id="cpuStat">0</span>%</div>
            <div>RAM: <span id="ramStat">0</span>%</div>
            <div>Темп: <span id="tempStat">--</span></div>

            <button id="updateBtn" class="update-btn">↻</button>
            <button id="exitBtn" style="background:#8b0000; color: white; border: none; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer;">⏻</button>
        </div>
    </header>

    <div class="container">
        <!-- Левая панель: сервоприводы -->
        <aside class="panel">
            <div class="panel-title">Сервоприводы</div>
            <div class="servo-controls">
                <div class="servo-row"><label>(00) Шея:</label><input type="range" id="servo0" min="0" max="180" value="90"><span id="servo0_val">90°</span></div>
                <div class="servo-row"><label>(01) Пр. плечо:</label><input type="range" id="servo1" min="0" max="270" value="135"><span id="servo1_val">135°</span></div>
                <div class="servo-row"><label>(02) Лев. плечо:</label><input type="range" id="servo2" min="0" max="270" value="135"><span id="servo2_val">135°</span></div>
                <div class="servo-row"><label>(03) Наклон:</label><input type="range" id="servo3" min="0" max="180" value="90"><span id="servo3_val">90°</span></div>
                <div class="servo-row"><label>(04) Пов. пр.:</label><input type="range" id="servo4" min="0" max="270" value="45"><span id="servo4_val">45°</span></div>
                <div class="servo-row"><label>(05) Пов. лев.:</label><input type="range" id="servo5" min="0" max="270" value="45"><span id="servo5_val">45°</span></div>
                <div class="servo-row"><label>(06) Пр. локоть:</label><input type="range" id="servo6" min="0" max="270" value="135"><span id="servo6_val">135°</span></div>
                <div class="servo-row"><label>(07) Лев. локоть:</label><input type="range" id="servo7" min="0" max="270" value="135"><span id="servo7_val">135°</span></div>
            </div>
        </aside>

        <!-- Центральная панель -->
        <main class="panel">
            <div class="tabs" id="viewTabs">
                <button id="tabVideo" class="active">Камера</button>
                <button id="tabMesh">3D Модель</button>
            </div>

            <div id="video-container">
                <img id="video-feed" src="/video_feed" alt="Video Stream" crossorigin="anonymous">
                <div id="depth-tooltip" class="depth-tooltip hidden"></div>
            </div>
            <div id="mesh-container" class="hidden">
                <canvas id="mesh-canvas"></canvas>
                <div id="mesh-tooltip" class="depth-tooltip hidden"></div>
            </div>

            <div class="tabs" id="controlsTabs" style="margin-top: 12px;">
                <button id="tabAIControls">Команды AI</button>
                <button id="tabCameraControls" class="active">Параметры камеры</button>
                <button id="tabTrackingControls">Трекинг & CV</button>
            </div>

            <div id="camera-controls">
                <div class="control-row">
                    <label>Основной глаз:</label>
                    <div style="display: flex; gap: 12px;">
                        <label><input type="radio" name="mainEye" id="eyeLeft" checked> Левый</label>
                        <label><input type="radio" name="mainEye" id="eyeRight"> Правый</label>
                    </div>
                </div>
                <div class="control-row"><label>Прозрачность глубины:</label><input type="range" id="depthAlpha" min="0" max="100" value="30"></div>
                <div class="control-group">
                    <div class="control-row"><label>Глубина (вычисления):</label><input type="checkbox" id="depthEnabled"></div>
                </div>
            </div>

            <div id="tracking-controls" class="hidden">
                <div class="control-row"><label>Включить трекинг:</label><input type="checkbox" id="trackingEnabled"></div>
                <div class="control-row"><label>Тип цели:</label>
                    <select id="trackingMode">
                        <option value="person">Человек</option>
                        <option value="face">Лицо</option>
                        <option value="motion">Движение</option>
                    </select>
                </div>
                <div class="control-row"><label>Scale X:</label><input type="range" id="trackingScaleX" min="0" max="200" value="50" step="1"><span id="scaleXVal">50</span></div>
                <div class="control-row"><label>Scale Y:</label><input type="range" id="trackingScaleY" min="0" max="200" value="30" step="1"><span id="scaleYVal">30</span></div>
                <div class="control-row"><label>Offset X:</label><input type="range" id="trackingOffsetX" min="-100" max="100" value="0" step="1"><span id="offsetXVal">0</span></div>
                <div class="control-row"><label>Offset Y:</label><input type="range" id="trackingOffsetY" min="-100" max="100" value="0" step="1"><span id="offsetYVal">0</span></div>
                <div class="control-row"><label>Авто-серво по цели:</label><input type="checkbox" id="servoTrackingEnabled"></div>
            </div>

            <div id="ai-controls" class="hidden" style="display:flex; flex-direction:column; gap: 12px;">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 6px; white-space: nowrap;">
                        <span style="font-size: 12px; color: var(--muted);">Звук</span>
                        <input type="checkbox" id="aiAudioEnabled" checked>
                    </label>
                    <span style="color:#44944a; font-family: monospace;">  >>></span>
                    <input type="text" id="ai-command-input" placeholder="Введите команду для ИИ..." style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius: 12px; padding: 8px 12px; font-family: monospace; outline: none;">
                    <button id="ai-send-btn" style="background: #44944a; color: white; border: none; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;">▶ Отправить</button>
                </div>
                <div class="panel-title"></div>
                <div id="ai-live-response" class="ai-live-block">...</div>
            </div>
        </main>

        <!-- Правая панель -->
        <aside class="panel">
            <div class="tabs" id="rightTabs">
                <button id="tabTerminal" class="active">Терминал</button>
                <button id="tabLogs">Логи</button>
                <button id="tabPython">Python</button>

                <div id="terminal-output" class="terminal-box">➜ Ожидание команд...</div>
                <div id="terminal-input-line" style="display: flex; margin-top: 8px; gap: 8px; align-items: center;">
                    <span style="color:#44944a; font-family: monospace;">❯</span>
                    <input type="text" id="terminal-command" placeholder="Введите команду (help, ls, ...)" style="flex:1; background:#111; border:1px solid #2c2c2c; color:#fff; border-radius: 12px; padding: 8px 12px; font-family: monospace; outline: none;">

            </div>

                <div style="display: flex; gap: 8px;">
                    <button id="run-python-btn" style="flex:1; background: #44944a; color: white; border: none; border-radius: 12px; padding: 8px 16px; cursor: pointer;">▶ Запустить</button>
                    <button id="clear-python-btn" style="background: #333; color: white; border: none; border-radius: 12px; padding: 8px 16px; cursor: pointer;">Очистить</button>
                </div>
                <div id="python-output" class="terminal-box" style="flex:1;"></div>
            </div>
        </aside>
    </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
// ===================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====================
let engine, scene3D, camera3D, meshModel = null, meshActive = false;
let lastMeshFetch = 0;

// DOM элементы
const videoContainer = document.getElementById('video-container');
const meshContainer = document.getElementById('mesh-container');
const tabVideo = document.getElementById('tabVideo');
const tabMesh = document.getElementById('tabMesh');
const depthTooltip = document.getElementById('depth-tooltip');
const meshTooltip = document.getElementById('mesh-tooltip');
const videoFeed = document.getElementById('video-feed');
const meshCanvas = document.getElementById('mesh-canvas');

// AI панель
const aiAudioEnabledChk = document.getElementById('aiAudioEnabled');
const aiCommandInput = document.getElementById('ai-command-input');
const aiSendBtn = document.getElementById('ai-send-btn');
const aiLiveResponse = document.getElementById('ai-live-response');

// Параметры камеры и трекинга
const eyeLeft = document.getElementById('eyeLeft');
const eyeRight = document.getElementById('eyeRight');
const depthAlphaSlider = document.getElementById('depthAlpha');
const depthEnabledChk = document.getElementById('depthEnabled');
const trackingEnabledChk = document.getElementById('trackingEnabled');
const trackingModeSelect = document.getElementById('trackingMode');
const trackingScaleX = document.getElementById('trackingScaleX');
const trackingScaleY = document.getElementById('trackingScaleY');
const trackingOffsetX = document.getElementById('trackingOffsetX');
const trackingOffsetY = document.getElementById('trackingOffsetY');
const scaleXSpan = document.getElementById('scaleXVal');
const scaleYSpan = document.getElementById('scaleYVal');
const offsetXSpan = document.getElementById('offsetXVal');
const offsetYSpan = document.getElementById('offsetYVal');
const servoTrackingChk = document.getElementById('servoTrackingEnabled');

// Терминал и вкладки
const terminalOutputDiv = document.getElementById('terminal-output');
const terminalInput = document.getElementById('terminal-command');
const logsOutput = document.getElementById('logs-output');
const tabTerminal = document.getElementById('tabTerminal');
const tabLogs = document.getElementById('tabLogs');
const tabPython = document.getElementById('tabPython');
const terminalPane = document.getElementById('terminal-pane');
const logsPane = document.getElementById('logs-pane');
const pythonPane = document.getElementById('python-pane');

// ===================== ИНИЦИАЛИЗАЦИЯ 3D СЦЕНЫ (BABYLON.JS) =====================
function initBabylon() {
    canvas3D = meshCanvas;
    engine = new BABYLON.Engine(canvas3D, true);
    scene3D = new BABYLON.Scene(engine);
    scene3D.clearColor = new BABYLON.Color4(0.07, 0.07, 0.07, 1.0);

    camera3D = new BABYLON.ArcRotateCamera("Camera", -Math.PI/4, Math.PI/3, 2, BABYLON.Vector3.Zero(), scene3D);
    camera3D.attachControl(canvas3D, true);
    camera3D.lowerRadiusLimit = 0.3;
    camera3D.upperRadiusLimit = 5;

    new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.5, 1, 0.5), scene3D);
    const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(0.5, 1, 0.5), scene3D);
    dirLight.intensity = 0.7;

    const grid = BABYLON.MeshBuilder.CreateGround("grid", { width: 4, height: 4, subdivisions: 20 }, scene3D);
    grid.isPickable = false;
    const gridMat = new BABYLON.StandardMaterial("gridMat", scene3D);
    gridMat.wireframe = true;
    gridMat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.3);
    grid.material = gridMat;

    BABYLON.MeshBuilder.CreateLines("axisX", { points: [BABYLON.Vector3.Zero(), new BABYLON.Vector3(0.5,0,0)] }, scene3D).color = BABYLON.Color3.Red();
    BABYLON.MeshBuilder.CreateLines("axisY", { points: [BABYLON.Vector3.Zero(), new BABYLON.Vector3(0,0.5,0)] }, scene3D).color = BABYLON.Color3.Green();
    BABYLON.MeshBuilder.CreateLines("axisZ", { points: [BABYLON.Vector3.Zero(), new BABYLON.Vector3(0,0,0.5)] }, scene3D).color = BABYLON.Color3.Blue();

    meshCanvas.addEventListener('mousemove', (evt) => {
        if (!meshActive || !meshModel) return;
        const pickResult = scene3D.pick(scene3D.pointerX, scene3D.pointerY);
        if (pickResult.hit && pickResult.pickedMesh === meshModel) {
            const p = pickResult.pickedPoint;
            meshTooltip.style.left = (evt.clientX - meshContainer.getBoundingClientRect().left + 12) + 'px';
            meshTooltip.style.top = (evt.clientY - meshContainer.getBoundingClientRect().top + 12) + 'px';
            meshTooltip.textContent = `X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;
            meshTooltip.classList.remove('hidden');
        } else {
            meshTooltip.classList.add('hidden');
        }
    });
    meshCanvas.addEventListener('mouseleave', () => meshTooltip.classList.add('hidden'));

    engine.runRenderLoop(() => scene3D.render());
    window.addEventListener('resize', () => engine.resize());
}

function buildMeshFromData(data) {
    if (!data.points || data.points.length === 0) return;
    const w = data.width, h = data.height, points = data.points;
    const positions = [], colors = [], indices = [];
    const vertMap = new Array(h * w).fill(-1);
    let vc = 0;

    for (let i = 0; i < points.length; i++) {
        const pt = points[i];
        if (pt.valid) {
            positions.push(pt.x / 100, pt.y / 100, pt.z / 100);
            colors.push(pt.r / 255, pt.g / 255, pt.b / 255);
            vertMap[i] = vc++;
        }
    }

    for (let y = 0; y < h-1; y++) {
        for (let x = 0; x < w-1; x++) {
            const i00 = vertMap[y*w+x], i01 = vertMap[y*w+x+1], i10 = vertMap[(y+1)*w+x], i11 = vertMap[(y+1)*w+x+1];
            if (i00!=-1 && i01!=-1 && i10!=-1) indices.push(i00, i01, i10);
            if (i01!=-1 && i11!=-1 && i10!=-1) indices.push(i01, i11, i10);
        }
    }

    if (meshModel) meshModel.dispose();
    const vertexData = new BABYLON.VertexData();
    vertexData.positions = positions;
    vertexData.indices = indices;
    vertexData.colors = colors;
    meshModel = new BABYLON.Mesh("depthMesh", scene3D);
    vertexData.applyToMesh(meshModel);
    const mat = new BABYLON.StandardMaterial("mat", scene3D);
    mat.disableLighting = true;
    mat.emissiveColor = BABYLON.Color3.White();
    mat.backFaceCulling = false;
    meshModel.material = mat;
}

async function updateMesh() {
    if (!meshActive || !scene3D) return;
    try {
        const resp = await fetch('/api/mesh');
        if (!resp.ok) return;
        const data = await resp.json();
        buildMeshFromData(data);
    } catch(e) { console.warn("Mesh error:", e); }
}

let meshInterval = null;
function startMeshView() {
    if (!scene3D) initBabylon();
    videoContainer.classList.add('hidden');
    meshContainer.classList.remove('hidden');
    meshActive = true;
    updateMesh();
    meshInterval = setInterval(updateMesh, 1000);
}

function stopMeshView() {
    meshActive = false;
    if (meshInterval) clearInterval(meshInterval);
    meshContainer.classList.add('hidden');
    videoContainer.classList.remove('hidden');
}

// ===================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ UI =====================
function setActiveTab(activeBtn, allBtns) {
    allBtns.forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
}

async function getVideoCoords(ix, iy) {
    try {
        const r = await fetch('/api/coords3d', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({x:ix,y:iy}) });
        const d = await r.json();
        if (d.x !== null) return `X:${d.x.toFixed(1)} Y:${d.y.toFixed(1)} Z:${d.z.toFixed(1)} см`;
    } catch(e) {}
    return null;
}

function initVideoTooltip() {
    videoFeed.addEventListener('mousemove', async (e) => {
        const rect = videoFeed.getBoundingClientRect();
        const sx = videoFeed.naturalWidth / rect.width;
        const sy = videoFeed.naturalHeight / rect.height;
        const text = await getVideoCoords(Math.round((e.clientX-rect.left)*sx), Math.round((e.clientY-rect.top)*sy));
        if (text) {
            depthTooltip.style.left = (e.clientX - videoContainer.getBoundingClientRect().left + 12) + 'px';
            depthTooltip.style.top = (e.clientY - videoContainer.getBoundingClientRect().top + 12) + 'px';
            depthTooltip.textContent = text;
            depthTooltip.classList.remove('hidden');
        } else depthTooltip.classList.add('hidden');
    });
    videoFeed.addEventListener('mouseleave', () => depthTooltip.classList.add('hidden'));
}

// ===================== СЕРВОПРИВОДЫ =====================
function updateServoVal(ch, val) {
    const s = document.getElementById(`servo${ch}_val`);
    if (s) s.textContent = val + '°';
}

async function setServo(ch, angle) {
    try { await fetch(`/api/servo/${ch}/${angle}`, {method:'POST'}); } catch(e) {}
}

for (let i=0; i<=7; i++) {
    const slider = document.getElementById(`servo${i}`);
    if (slider) {
        slider.addEventListener('input', () => updateServoVal(i, slider.value));
        slider.addEventListener('change', () => setServo(i, parseInt(slider.value)));
        updateServoVal(i, slider.value);
    }
}

// ===================== ПАРАМЕТРЫ КАМЕРЫ И ТРЕКИНГ =====================
async function sendCameraParams() {
    try {
        await fetch('/api/camera/params', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                depth_enabled: depthEnabledChk.checked,
                face_tracking_enabled: trackingEnabledChk.checked,
                tracking_mode: trackingModeSelect.value,
                tracking_scale_x: parseInt(trackingScaleX.value),
                tracking_scale_y: parseInt(trackingScaleY.value),
                tracking_offset_x: parseInt(trackingOffsetX.value),
                tracking_offset_y: parseInt(trackingOffsetY.value)
            })
        });
    } catch(e) {}
}

async function updateRenderParams() {
    try {
        await fetch('/update', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ alpha_depth: parseInt(depthAlphaSlider.value), show_left: eyeLeft.checked, num_disp: 5 })
        });
    } catch(e) {}
}

async function loadCameraParams() {
    try {
        const r = await fetch('/api/camera/params');
        const p = await r.json();
        depthEnabledChk.checked = p.depth_enabled || false;
        trackingEnabledChk.checked = p.face_tracking_enabled || false;
        trackingModeSelect.value = p.tracking_mode || 'face';
        trackingScaleX.value = p.tracking_scale_x ?? 50;
        trackingScaleY.value = p.tracking_scale_y ?? 30;
        trackingOffsetX.value = p.tracking_offset_x ?? 0;
        trackingOffsetY.value = p.tracking_offset_y ?? 0;
        updateTrackingDisplay();
    } catch(e) {}
}

async function loadServoTrackingState() {
    try {
        const r = await fetch('/api/servo/tracking');
        const d = await r.json();
        servoTrackingChk.checked = d.enabled === true;
    } catch(e) {}
}

function updateTrackingDisplay() {
    if (scaleXSpan) scaleXSpan.textContent = trackingScaleX.value;
    if (scaleYSpan) scaleYSpan.textContent = trackingScaleY.value;
    if (offsetXSpan) offsetXSpan.textContent = trackingOffsetX.value;
    if (offsetYSpan) offsetYSpan.textContent = trackingOffsetY.value;
}

// ===================== ТЕРМИНАЛ =====================
let lastTerminalOutput = '', fetchingTerminal = false, sendingCmd = false;

async function fetchTerminalOutput() {
    if (fetchingTerminal) return;
    fetchingTerminal = true;
    try {
        const r = await fetch('/api/cmd/output');
        const d = await r.json();
        if (d.output !== lastTerminalOutput) {
            terminalOutputDiv.textContent = d.output.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g,'');
            terminalOutputDiv.scrollTop = terminalOutputDiv.scrollHeight;
            lastTerminalOutput = d.output;
        }
    } catch(e) {} finally { fetchingTerminal = false; }
}

async function sendTerminalCommand(cmd) {
    if (sendingCmd || !cmd.trim()) return;
    sendingCmd = true;
    try {
        await fetch('/api/cmd/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd})});
        await fetchTerminalOutput();
    } catch(e) {} finally { sendingCmd = false; }
}

// ===================== AI =====================
let lastResponseText = '', pollingInterval = null;

function startPollingAI() {
    if (pollingInterval) clearInterval(pollingInterval);
    pollingInterval = setInterval(async () => {
        try {
            const r = await fetch('/api/ai/get_current_response');
            const d = await r.json();
            const txt = d.response || '';
            if (txt !== lastResponseText) {
                lastResponseText = txt;
                aiLiveResponse.textContent = txt || '✨ Ожидание ответа...';
                aiLiveResponse.scrollTop = aiLiveResponse.scrollHeight;
                aiLiveResponse.classList.add('flash-green');
                setTimeout(() => aiLiveResponse.classList.remove('flash-green'), 300);
            }
        } catch(e) {}
    }, 200);
}

async function sendAICommand() {
    const cmd = aiCommandInput.value.trim();
    if (!cmd) return;
    lastResponseText = '';
    aiLiveResponse.textContent = '🤖 Генерация...';
    aiLiveResponse.classList.add('flash-green');
    setTimeout(() => aiLiveResponse.classList.remove('flash-green'), 300);
    aiCommandInput.value = '';
    try {
        const r = await fetch('/api/ai/command', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd})});
        const d = await r.json();
        if (d.error) aiLiveResponse.textContent = 'Ошибка: ' + d.error;
    } catch(e) { aiLiveResponse.textContent = 'Ошибка отправки'; }
}

// ===================== СТАТИСТИКА =====================
async function fetchSystemStats() {
    try {
        const r = await fetch('/api/data');
        const d = await r.json();
        document.getElementById('cpuStat').textContent = d.cpu ?? 0;
        document.getElementById('ramStat').textContent = d.ram ?? 0;
        document.getElementById('tempStat').textContent = d.temp ?? '--';
        document.getElementById('fpsStat').textContent = d.fps ?? 0;
        if (!logsPane.classList.contains('hidden')) {
            logsOutput.textContent = (d.logs || []).join('\n');
            logsOutput.scrollTop = logsOutput.scrollHeight;
        }
    } catch(e) {}
}

// ===================== ОБРАБОТЧИКИ СОБЫТИЙ =====================
function attachEvents() {
    tabVideo.onclick = () => { setActiveTab(tabVideo, [tabVideo, tabMesh]); stopMeshView(); };
    tabMesh.onclick = () => { setActiveTab(tabMesh, [tabVideo, tabMesh]); startMeshView(); };

    const tabAIControls = document.getElementById('tabAIControls');
    const tabCameraControls = document.getElementById('tabCameraControls');
    const tabTrackingControls = document.getElementById('tabTrackingControls');
    const aiControlsDiv = document.getElementById('ai-controls');
    const cameraControlsDiv = document.getElementById('camera-controls');
    const trackingControlsDiv = document.getElementById('tracking-controls');

    tabCameraControls.onclick = () => {
        setActiveTab(tabCameraControls, [tabAIControls, tabCameraControls, tabTrackingControls]);
        cameraControlsDiv.classList.remove('hidden');
        aiControlsDiv.classList.add('hidden');
        trackingControlsDiv.classList.add('hidden');
    };
    tabTrackingControls.onclick = () => {
        setActiveTab(tabTrackingControls, [tabAIControls, tabCameraControls, tabTrackingControls]);
        trackingControlsDiv.classList.remove('hidden');
        aiControlsDiv.classList.add('hidden');
        cameraControlsDiv.classList.add('hidden');
    };
    tabAIControls.onclick = () => {
        setActiveTab(tabAIControls, [tabAIControls, tabCameraControls, tabTrackingControls]);
        aiControlsDiv.classList.remove('hidden');
        cameraControlsDiv.classList.add('hidden');
        trackingControlsDiv.classList.add('hidden');
    };

    tabTerminal.onclick = () => {
        setActiveTab(tabTerminal, [tabTerminal, tabLogs, tabPython]);
        terminalPane.classList.remove('hidden'); logsPane.classList.add('hidden'); pythonPane.classList.add('hidden');
    };
    tabLogs.onclick = () => {
        setActiveTab(tabLogs, [tabTerminal, tabLogs, tabPython]);
        logsPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); pythonPane.classList.add('hidden');
        fetchSystemStats();
    };
    tabPython.onclick = () => {
        setActiveTab(tabPython, [tabTerminal, tabLogs, tabPython]);
        pythonPane.classList.remove('hidden'); terminalPane.classList.add('hidden'); logsPane.classList.add('hidden');
    };

    eyeLeft.onchange = updateRenderParams;
    eyeRight.onchange = updateRenderParams;
    depthAlphaSlider.oninput = updateRenderParams;
    depthEnabledChk.onchange = sendCameraParams;
    trackingEnabledChk.onchange = sendCameraParams;
    trackingModeSelect.onchange = sendCameraParams;
    trackingScaleX.oninput = () => { updateTrackingDisplay(); sendCameraParams(); };
    trackingScaleY.oninput = () => { updateTrackingDisplay(); sendCameraParams(); };
    trackingOffsetX.oninput = () => { updateTrackingDisplay(); sendCameraParams(); };
    trackingOffsetY.oninput = () => { updateTrackingDisplay(); sendCameraParams(); };
    servoTrackingChk.onchange = async () => {
        try { await fetch('/api/servo/tracking', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:servoTrackingChk.checked})}); } catch(e) {}
    };

    terminalInput.onkeydown = (e) => { if (e.key==='Enter') { sendTerminalCommand(terminalInput.value.trim()); terminalInput.value = ''; } };
    aiSendBtn.onclick = sendAICommand;
    aiCommandInput.onkeydown = (e) => { if (e.key==='Enter') sendAICommand(); };
    aiAudioEnabledChk.onchange = async () => {
        try { await fetch('/api/ai/audio', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:aiAudioEnabledChk.checked})}); } catch(e) {}
    };

    document.getElementById('run-python-btn').onclick = async () => {
        const code = document.getElementById('python-code').value;
        if (!code.trim()) return;
        const out = document.getElementById('python-output');
        out.textContent = 'Выполнение...';
        try {
            const r = await fetch('/api/python/exec', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})});
            const d = await r.json();
            out.textContent = (d.stdout||'') + ((d.stderr)?'\n--- ОШИБКИ ---\n'+d.stderr:'') || '✓ Успешно';
            out.scrollTop = out.scrollHeight;
        } catch(e) { out.textContent = 'Ошибка: ' + e.message; }
    };
    document.getElementById('clear-python-btn').onclick = () => {
        document.getElementById('python-code').value = '';
        document.getElementById('python-output').textContent = '';
    };

    document.getElementById('updateBtn').onclick = async () => {
        const btn = document.getElementById('updateBtn');
        btn.disabled = true; btn.textContent = 'Обновление...';
        try {
            const r = await fetch('/api/update', {method:'POST'});
            const d = await r.json();
            alert(d.message || 'Обновление запущено.');
        } catch(e) { alert('Ошибка: '+e.message); btn.disabled = false; btn.textContent = '↻'; }
    };
    document.getElementById('exitBtn').onclick = async () => {
        try {
            const r = await fetch('/api/shutdown', {method:'POST'});
            alert((await r.json()).message || 'Завершение работы...');
        } catch(e) { alert('Ошибка при завершении'); }
    };
}

// ===================== ИНИЦИАЛИЗАЦИЯ =====================
async function init() {
    attachEvents();
    await loadCameraParams();
    await loadServoTrackingState();
    updateTrackingDisplay();
    await updateRenderParams();
    fetchSystemStats();
    fetchTerminalOutput();
    initVideoTooltip();
    startPollingAI();
    setInterval(fetchSystemStats, 2200);
    setInterval(fetchTerminalOutput, 400);
    stopMeshView();
}
init();
</script>
</body>
