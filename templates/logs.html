<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 — Логи системы</title>
    <style>
        :root { --text:#ecf0ff; --muted:#aab5d6; --border:rgba(210,220,255,.22); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(circle at 20% 15%, rgba(120,140,255,.22), transparent 42%), radial-gradient(circle at 82% 84%, rgba(96,208,255,.2), transparent 45%), linear-gradient(145deg, #04060b 0%, #0d1220 40%, #0a101d 100%);
            display: flex;
            flex-direction: column;
        }
        .glass {
            background: linear-gradient(140deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
            border: 1px solid var(--border);
            backdrop-filter: blur(26px) saturate(150%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        header { margin: 12px 12px 0; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; }
        header a { color: var(--text); text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 12px; border: 1px solid transparent; background: rgba(255,255,255,.05); }
        header a:hover { border-color: var(--border); }
        .logs-container {
            flex: 1;
            margin: 12px;
            padding: 16px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6;
            font-family: 'JetBrains Mono', monospace;
            color: #c1cae6;
        }
        .logs-stream {
            min-height: 100%;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(2,6,15,.52);
            padding: 12px;
        }
        .logs-stream div { margin-bottom: 2px; }
    </style>
</head>
<body>
    <header class="glass">
        <a href="/">R2</a>
        <a href="/screen">Экран</a>
        <a href="/terminal">CMD</a>
        <a href="/logs">Логи</a>
    </header>
    <div class="logs-container glass">
        <div class="logs-stream" id="logs"></div>
    </div>
    <script>
        async function fetchLogs() {
            try {
                const r = await fetch('/api/data');
                const d = await r.json();
                document.getElementById('logs').innerHTML = d.logs.map(l => `<div>${escapeHtml(l)}</div>`).join('');
                document.getElementById('logs').scrollTop = document.getElementById('logs').scrollHeight;
            } catch(e) {}
        }
        function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
        fetchLogs();
        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>
