<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 - Системные логи</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #ccc;
            font-family: 'Segoe UI', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(20,20,20,0.8);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            text-align: center;
            border-bottom: 1px solid #2c2c2c;
        }
        header a {
            color: #ddd;
            text-decoration: none;
            font-size: 18px;
            margin: 0 20px;
        }
        .logs-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.4;
            white-space: pre-wrap;
            background: #050505;
        }
        .logs-container div {
            border-bottom: 1px solid #1a1a1a;
            padding: 4px 0;
        }
    </style>
</head>
<body>
<header>
    <a href="/">R2</a><a href="/screen">Экран</a><a href="/terminal">CMD</a><a href="/logs">Логи</a>
</header>
<div class="logs-container" id="logs"></div>
<script>
    const logsDiv = document.getElementById('logs');
    async function fetchLogs() {
        try {
            const r = await fetch('/api/data');
            const d = await r.json();
            // Ниже показываем системные логи (как и было), но без изменения логики
            logsDiv.innerHTML = d.logs?.map(l => `<div>${escapeHtml(l)}</div>`).join('') || '<div>Нет логов</div>';
            logsDiv.scrollTop = logsDiv.scrollHeight;
        } catch(e) {}
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    fetchLogs();
    setInterval(fetchLogs, 3000);
</script>
</body>
</html>
