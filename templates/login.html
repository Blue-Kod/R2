<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>R2 — Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #0a0a0a; --panel: #121212; --text: #f0f0f0; --line: #2a2a2a; --accent: #44944a; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 40px; width: 340px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #9c9c9c; margin-bottom: 24px; font-size: 13px; }
        input { width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid var(--line); border-radius: 12px; color: white; font-size: 14px; outline: none; margin-bottom: 16px; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 12px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
        button:hover { background: #55a55a; }
        .error { color: #ff6b6b; font-size: 12px; margin-top: 12px; display: none; }
        .error.show { display: block; }
        .loading { display: none; margin-top: 12px; font-size: 12px; color: #9c9c9c; }
        .loading.show { display: block; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>R2</h1>
        <p id="subtitle">Введите пароль для доступа к панели управления</p>
        <div id="authForm">
            <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="current-password">
            <button id="loginBtn" onclick="doLogin()">Войти</button>
            <div class="error" id="errorMsg">Неверный пароль</div>
        </div>
        <div class="loading" id="loadingMsg">Вход...</div>
    </div>
    <script>
        const STORE_KEY = 'r2_pwd';
        const input = document.getElementById('passwordInput');
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');
        const loading = document.getElementById('loadingMsg');
        const form = document.getElementById('authForm');

        function showLoading(text) { form.style.display = 'none'; loading.textContent = text || 'Вход...'; loading.classList.add('show'); }
        function showForm() { form.style.display = ''; loading.classList.remove('show'); if (input) input.focus(); }

        async function tryLogin(pwd) {
            if (!pwd) return false;
            try {
                const r = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                if (r.ok) return true;
                const d = await r.json().catch(() => ({}));
                err.textContent = d.error || 'Неверный пароль';
            } catch (e) { err.textContent = 'Ошибка соединения'; }
            return false;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const saved = localStorage.getItem(STORE_KEY);
            if (!saved) { showForm(); return; }
            showLoading('Вход...');
            if (await tryLogin(saved)) { window.location.href = '/'; return; }
            localStorage.removeItem(STORE_KEY);
            err.classList.add('show');
            showForm();
        });

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

        async function doLogin() {
            const pwd = input.value.trim();
            if (!pwd) return;
            btn.disabled = true; showLoading('Вход...'); err.classList.remove('show');
            if (await tryLogin(pwd)) {
                localStorage.setItem(STORE_KEY, pwd);
                window.location.href = '/';
                return;
            }
            err.classList.add('show'); showForm(); btn.disabled = false;
        }
    </script>
</body>
</html>
