<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>R2 — Вход</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/r2.css">
</head>
<body class="grid min-h-dvh place-items-center p-4">
    <div class="anim-in flex w-full max-w-[360px] flex-col items-center">
        <div class="mb-7 flex justify-center">
            <svg viewBox="0 0 42 32" class="r2-mark-intro h-14 w-auto text-foreground" fill="none"
                 stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path pathLength="1" d="M8 26V6h9a4.5 4.5 0 0 1 0 9H8M13 15l6.5 11"/>
                <path pathLength="1" d="M25 10a4.5 4.5 0 0 1 9 0l-9 16h9"/>
            </svg>
        </div>

        <h1 class="text-lg font-semibold tracking-tight text-foreground">Добро пожаловать</h1>
        <p class="mt-1 text-center text-sm text-muted-foreground">Введите пароль для доступа к роботу.</p>

        <div id="authForm" class="mt-6 w-full">
            <form id="loginForm" class="flex flex-col gap-4">
                <label class="flex flex-col gap-2">
                    <span class="text-sm font-medium text-foreground">Пароль</span>
                    <input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••"
                           class="h-9 w-full rounded-lg border border-input bg-transparent px-3 text-sm outline-none transition-[color,box-shadow] placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/30">
                </label>
                <button id="loginBtn" type="submit"
                        class="press inline-flex h-9 w-full items-center justify-center rounded-lg bg-primary px-3 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/80 disabled:pointer-events-none disabled:opacity-50">
                    Войти
                </button>
                <p class="min-h-[18px] text-center text-sm text-destructive" id="errorMsg"></p>
            </form>
        </div>

        <div id="loadingMsg" class="hidden items-center gap-2 text-sm text-muted-foreground">
            <svg viewBox="0 0 24 24" fill="none" class="size-4 animate-spin" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            Вход…
        </div>
    </div>

    <script>
        const STORE_KEY = 'r2_pwd';
        const input = document.getElementById('passwordInput');
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');
        const loading = document.getElementById('loadingMsg');
        const form = document.getElementById('authForm');

        function showLoading() { form.classList.add('hidden'); loading.classList.remove('hidden'); loading.classList.add('flex'); }
        function showForm() { form.classList.remove('hidden'); loading.classList.add('hidden'); loading.classList.remove('flex'); if (input) input.focus(); }

        async function tryLogin(pwd) {
            if (!pwd) return false;
            try {
                const r = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                if (r.ok) return true;
                const d = await r.json().catch(() => ({}));
                err.textContent = d.error || 'Неверный пароль';
            } catch (e) { err.textContent = 'Ошибка соединения'; }
            return false;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = input.value.trim();
            if (!pwd) return;
            btn.disabled = true; showLoading(); err.textContent = '';
            if (await tryLogin(pwd)) {
                localStorage.setItem(STORE_KEY, pwd);
                window.location.href = '/';
                return;
            }
            showForm(); btn.disabled = false;
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const saved = localStorage.getItem(STORE_KEY);
            if (!saved) { showForm(); return; }
            showLoading();
            if (await tryLogin(saved)) { window.location.href = '/'; return; }
            localStorage.removeItem(STORE_KEY);
            err.textContent = 'Сохранённый пароль не подошёл';
            showForm();
        });
    </script>
</body>
</html>
