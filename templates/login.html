<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>R2 — вход</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/r2.css">
</head>
<body class="grid min-h-dvh place-items-center p-4">
    <div class="anim-fade flex w-full max-w-[320px] flex-col">
        <div class="mb-8 flex">
            <svg viewBox="0 0 42 32" class="r2-mark-intro h-12 w-auto text-foreground" fill="none"
                 stroke="currentColor" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
                <path pathLength="1" d="M8 26V6h9a4.5 4.5 0 0 1 0 9H8M13 15l6.5 11"/>
                <path pathLength="1" d="M25 10a4.5 4.5 0 0 1 9 0l-9 16h9"/>
            </svg>
        </div>

        <div id="authForm" class="w-full">
            <form id="loginForm" class="flex flex-col gap-2">
                <span class="lbl">пароль</span>
                <input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••"
                       class="h-10 w-full border-0 border-b border-border bg-transparent px-0 text-[15px] text-foreground outline-none transition-colors placeholder:text-muted-foreground/50 focus:border-foreground">
                <button id="loginBtn" type="submit"
                        class="press mt-4 inline-flex h-10 w-full items-center justify-center rounded-md bg-primary px-3 text-[13px] font-medium text-primary-foreground transition-colors hover:bg-primary/85 disabled:pointer-events-none disabled:opacity-50">
                    войти
                </button>
                <p class="min-h-[16px] text-center text-[12px] text-destructive" id="errorMsg"></p>
            </form>
        </div>

        <div id="loadingMsg" class="hidden items-center gap-2 text-muted-foreground">
            <svg viewBox="0 0 24 24" fill="none" class="size-4 animate-spin" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            Вход…
        </div>
    </div>

    <script>
        const STORE_KEY = 'r2_pwd';
        // Куда вернуть после входа: исходная страница из ?next=… (только свой
        // путь — защита от open redirect), иначе корень.
        const rawNext = new URLSearchParams(location.search).get('next');
        const nextUrl = (rawNext && rawNext.startsWith('/') && !rawNext.startsWith('//'))
            ? rawNext : '/';
        const input = document.getElementById('passwordInput');
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');
        const loading = document.getElementById('loadingMsg');
        const form = document.getElementById('authForm');

        function showLoading() { form.classList.add('hidden'); loading.classList.remove('hidden'); loading.classList.add('flex'); }
        function showForm() { form.classList.remove('hidden'); loading.classList.add('hidden'); loading.classList.remove('flex'); if (input) input.focus(); }

        async function tryLogin(pwd) {
            if (!pwd) return false;
            try {
                const r = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                if (r.ok) return true;
                const d = await r.json().catch(() => ({}));
                err.textContent = d.error || 'Неверный пароль';
            } catch (e) { err.textContent = 'Ошибка соединения'; }
            return false;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = input.value.trim();
            if (!pwd) return;
            btn.disabled = true; showLoading(); err.textContent = '';
            if (await tryLogin(pwd)) {
                localStorage.setItem(STORE_KEY, pwd);
                window.location.href = nextUrl;
                return;
            }
            showForm(); btn.disabled = false;
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const saved = localStorage.getItem(STORE_KEY);
            if (!saved) { showForm(); return; }
            showLoading();
            if (await tryLogin(saved)) { window.location.href = nextUrl; return; }
            localStorage.removeItem(STORE_KEY);
            err.textContent = 'Сохранённый пароль не подошёл';
            showForm();
        });
    </script>
</body>
</html>
