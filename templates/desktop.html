<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>R2 — Удалённый рабочий стол</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #0a0a0a; --panel: #121212; --text: #f0f0f0; --line: #2a2a2a; --accent: #44944a; --danger: #8b0000; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter','Segoe UI',system-ui,sans-serif; font-size: 13px; }
        .layout { width: 100%; height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { color: var(--text); text-decoration: none; border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .nav-links a:hover { background: #1f1f1f; border-color: #3a3a3a; }
        .nav-links a.active { background: var(--accent); border-color: var(--accent); }
        .controls { display: flex; gap: 10px; align-items: center; }
        .btn { border: none; border-radius: 12px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-start { background: var(--accent); color: white; }
        .btn-start:hover:not(:disabled) { background: #55a55a; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-stop:hover:not(:disabled) { background: #a50000; }
        .status { font-size: 12px; color: #9c9c9c; }
        .status.active { color: var(--accent); }
        .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        .status .dot.off { background: #555; }
        .status .dot.on { background: var(--accent); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .container { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
        .placeholder { text-align: center; color: #555; }
        .placeholder h2 { font-size: 24px; margin-bottom: 12px; font-weight: 400; }
        .placeholder p { font-size: 14px; }
        .placeholder .big-btn { margin-top: 24px; padding: 16px 48px; font-size: 18px; border-radius: 16px; }
        .video-wrap { width: 100%; height: 100%; border-radius: 16px; overflow: hidden; background: #070707; display: flex; align-items: center; justify-content: center; position: relative; }
        .video-wrap video, .video-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .overlay-msg { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #9c9c9c; padding: 8px 16px; border-radius: 10px; font-size: 12px; pointer-events: none; }
        .loading-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .layout { padding: 8px; }
            .topbar { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>
<div class="layout">
    <header class="topbar">
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/desktop" class="active">Рабочий стол</a>
            <a href="/file_manager">Файлы</a>
        </div>
        <div class="controls">
            <span class="status" id="statusIndicator"><span class="dot off"></span>Неактивно</span>
            <button class="btn btn-start" id="startBtn">▶ СТАРТ</button>
            <button class="btn btn-stop" id="stopBtn" disabled>■ СТОП</button>
        </div>
    </header>
    <div class="container">
        <div class="placeholder" id="placeholder">
            <h2>🖥️ Удалённый рабочий стол</h2>
            <p>Нажмите «СТАРТ» чтобы начать трансляцию экрана робота</p>
            <p style="margin-top:8px;font-size:12px;color:#666;">Глаза робота будут скрыты на время трансляции</p>
            <button class="btn btn-start big-btn" id="startBigBtn">▶ СТАРТ</button>
        </div>
        <div class="video-wrap hidden" id="videoWrap">
            <img id="desktopFeed" src="" alt="Desktop Stream">
            <div class="overlay-msg">Трансляция рабочего стола</div>
        </div>
    </div>
</div>
<script>
const statusEl = document.getElementById('statusIndicator');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const startBigBtn = document.getElementById('startBigBtn');
const placeholder = document.getElementById('placeholder');
const videoWrap = document.getElementById('videoWrap');
const desktopFeed = document.getElementById('desktopFeed');
let isRunning = false;
let leaveTimer = null;
const LEAVE_TIMEOUT = 3000;

// Check status on load
async function checkStatus() {
    try {
        const r = await fetch('/api/desktop/status');
        const d = await r.json();
        if (d.active) setRunning(true);
    } catch(e) {}
}

function setRunning(active) {
    isRunning = active;
    startBtn.disabled = active;
    stopBtn.disabled = !active;
    startBigBtn.disabled = active;
    if (active) {
        placeholder.classList.add('hidden');
        videoWrap.classList.remove('hidden');
        desktopFeed.src = '/desktop_feed?_t=' + Date.now();
        statusEl.innerHTML = '<span class="dot on"></span>Трансляция';
        statusEl.classList.add('active');
    } else {
        placeholder.classList.remove('hidden');
        videoWrap.classList.add('hidden');
        desktopFeed.src = '';
        statusEl.innerHTML = '<span class="dot off"></span>Неактивно';
        statusEl.classList.remove('active');
    }
}

async function doStart() {
    try {
        startBtn.disabled = true;
        startBtn.innerHTML = '<span class="loading-spinner"></span>Запуск...';
        startBigBtn.disabled = true;
        startBigBtn.innerHTML = '<span class="loading-spinner"></span>Запуск...';
        const r = await fetch('/api/desktop/start', {method:'POST'});
        const d = await r.json();
        if (d.status === 'ok') {
            setRunning(true);
        } else {
            alert('Ошибка: ' + (d.error || 'Неизвестная ошибка'));
        }
    } catch(e) {
        alert('Ошибка соединения');
    } finally {
        startBtn.innerHTML = '▶ СТАРТ';
        startBigBtn.innerHTML = '▶ СТАРТ';
        if (!isRunning) {
            startBtn.disabled = false;
            startBigBtn.disabled = false;
        }
    }
}

async function doStop() {
    try {
        stopBtn.disabled = true;
        stopBtn.innerHTML = '<span class="loading-spinner"></span>Стоп...';
        await fetch('/api/desktop/stop', {method:'POST'});
        setRunning(false);
    } catch(e) {
        alert('Ошибка соединения');
    } finally {
        stopBtn.innerHTML = '■ СТОП';
        if (isRunning) stopBtn.disabled = false;
    }
}

startBtn.onclick = doStart;
startBigBtn.onclick = doStart;
stopBtn.onclick = doStop;

// Visibility detection for eyes restore
document.addEventListener('visibilitychange', () => {
    if (document.hidden && isRunning) {
        leaveTimer = setTimeout(() => {
            doStop();
        }, LEAVE_TIMEOUT);
    } else {
        if (leaveTimer) {
            clearTimeout(leaveTimer);
            leaveTimer = null;
        }
    }
});

// Before unload - stop desktop
window.addEventListener('beforeunload', () => {
    if (isRunning) {
        navigator.sendBeacon('/api/desktop/stop');
    }
});

checkStatus();
</script>
</body>
</html>
