<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 — Экран</title>
    <style>
        :root { --text:#ecf0ff; --muted:#aab5d6; --border:rgba(210,220,255,.22); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(circle at 20% 15%, rgba(120,140,255,.22), transparent 42%), radial-gradient(circle at 82% 84%, rgba(96,208,255,.2), transparent 45%), linear-gradient(145deg, #04060b 0%, #0d1220 40%, #0a101d 100%);
            display: flex;
            flex-direction: column;
        }
        .glass {
            background: linear-gradient(140deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
            border: 1px solid var(--border);
            backdrop-filter: blur(26px) saturate(150%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        header { margin: 12px 12px 0; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; }
        header a { color: var(--text); text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 12px; border: 1px solid transparent; background: rgba(255,255,255,.05); }
        header a:hover { border-color: var(--border); }
        .screen-wrap {
            flex: 1;
            margin: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        #video-container {
            flex: 1;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(0,0,0,.55);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video-feed { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
<header class="glass">
    <a href="/">R2</a>
    <a href="/screen">Экран</a>
    <a href="/terminal">CMD</a>
    <a href="/logs">Логи</a>
</header>
<div class="screen-wrap glass">
    <div class="panel-title">Камера</div>
    <div id="video-container">
        <img id="video-feed" src="/video_feed" alt="Видео поток">
    </div>
</div>
</body>
</html>
