<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>R2 — Eyes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
        }
        .face {
            width: min(92vw, 92vh * 0.56);
            height: min(92vh, 92vw * 1.78);
            max-width: 720px;
            max-height: 1280px;
            aspect-ratio: 9 / 16;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .eyes {
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            position: relative;
            transform: translate3d(0, 0, 0);
            transition: transform 0.6s ease;
        }
        .eye {
            width: 31%;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: 50%;
            transform-origin: center center;
            transform: scaleY(1.5);
            box-shadow: 0 0 28px rgba(255, 255, 255, 0.22);
            transition: transform 0.25s ease, border-radius 0.25s ease, background 0.25s ease;
        }
        .eye.blink {
            transform: scaleY(0.08);
            transition: transform 0.12s ease;
        }
        .brow {
            position: absolute;
            top: 5%;
            width: 30%;
            height: 12px;
            border-radius: 999px;
            background: #fff;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #brow-left { left: 15%; }
        #brow-right { right: 15%; }

        .emote-normal .eye { border-radius: 50%; }

        .emote-sad .eye {
            border-radius: 48% 48% 56% 56%;
            transform: rotate(-6deg);
        }
        .emote-sad #eye-right { transform: rotate(6deg); }
        .emote-sad .brow { opacity: 1; transform: rotate(-8deg) translateY(-8px); }
        .emote-sad #brow-right { transform: rotate(8deg) translateY(-8px); }

        .emote-excited .eye {
            transform: scale(1.03);
            box-shadow: 0 0 38px rgba(255, 255, 255, 0.32);
        }

        .emote-spooked .eye {
            width: 28%;
            transform: scaleY(1.2);
            border: 4px solid #fff;
            background: transparent;
        }

        .emote-unamused .eye {
            border-radius: 45% 45% 60% 60%;
            transform: scaleY(0.62);
        }
        .emote-unamused .brow { opacity: 1; transform: rotate(0deg); }

        .emote-worried .eye {
            border-radius: 45% 45% 58% 58%;
            transform: rotate(-7deg) scaleY(0.75);
        }
        .emote-worried #eye-right { transform: rotate(7deg) scaleY(0.75); }
        .emote-worried .brow { opacity: 1; transform: rotate(-14deg); }
        .emote-worried #brow-right { transform: rotate(14deg); }

        .emote-woozy .eye {
            border-radius: 42% 52% 58% 48%;
            transform: rotate(-10deg) scaleY(0.8);
        }
        .emote-woozy #eye-right { transform: rotate(10deg) scaleY(0.8); }

        .emote-angry .eye {
            border-radius: 50% 50% 62% 62%;
            transform: scaleY(0.72);
        }
        .emote-angry .brow { opacity: 1; transform: rotate(18deg) translateY(-10px); }
        .emote-angry #brow-right { transform: rotate(-18deg) translateY(-10px); }

        .emote-wince .eye {
            border-radius: 50%;
            transform: scaleY(0.4);
        }
        .emote-wince .brow { opacity: 1; transform: rotate(10deg); }
        .emote-wince #brow-right { transform: rotate(-10deg); }

        .touch-zone {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 15vh;
            z-index: 20;
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .menu-overlay.visible {
            display: flex;
        }
        .menu-card {
            width: min(88vw, 380px);
            border: 1px solid #3b3b3b;
            border-radius: 14px;
            background: #101010;
            padding: 16px;
            color: #fff;
        }
        .menu-title {
            font-size: 14px;
            color: #bdbdbd;
            margin-bottom: 12px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .menu-ip {
            font-size: 18px;
            margin-bottom: 14px;
            font-weight: 600;
            word-break: break-word;
        }
        .menu-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .menu-btn {
            border: 1px solid #4a4a4a;
            background: #181818;
            color: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }
        .menu-btn:active {
            transform: translateY(1px);
        }
        .menu-btn.danger {
            border-color: #7a2e2e;
            background: #281212;
        }
    </style>
</head>
<body>
<main class="face" aria-label="Robot face screen">
    <section class="eyes emote-normal" id="eyes">
        <div class="brow" id="brow-left"></div>
        <div class="brow" id="brow-right"></div>
        <div class="eye" id="eye-left"></div>
        <div class="eye" id="eye-right"></div>
    </section>
</main>
<div class="touch-zone" id="touch-zone" aria-hidden="true"></div>
<div class="menu-overlay" id="menu-overlay" aria-hidden="true">
    <div class="menu-card">
        <div class="menu-title">Система</div>
        <div class="menu-ip" id="menu-ip">IP: ...</div>
        <div class="menu-actions">
            <button class="menu-btn" id="menu-home">Главная</button>
            <button class="menu-btn danger" id="menu-exit">Выйти</button>
        </div>
    </div>
</div>
    <script>
    const eyes = document.getElementById("eyes");
    const leftEye = document.getElementById("eye-left");
    const rightEye = document.getElementById("eye-right");
    const touchZone = document.getElementById("touch-zone");
    const menuOverlay = document.getElementById("menu-overlay");
    const menuIp = document.getElementById("menu-ip");
    const menuHome = document.getElementById("menu-home");
    const menuExit = document.getElementById("menu-exit");
    const supportedEmotes = new Set(["normal", "sad", "excited", "spooked", "unamused", "worried", "woozy", "angry", "wince"]);
    let currentEmote = "normal";

    // Check if pywebview API is available
    const hasPyWebView = typeof pywebview !== 'undefined';

    function applyEyesPosition(x, y) {
        // Normalized x/y (-1..1) from backend to pixel offsets.
        const clampedX = Math.max(-1, Math.min(1, Number(x) || 0));
        const clampedY = Math.max(-1, Math.min(1, Number(y) || 0));
        const pxX = clampedX * 10;
        const pxY = clampedY * 7;
        eyes.style.transform = `translate3d(${pxX}px, ${pxY}px, 0)`;
    }

    function blink() {
        leftEye.classList.add("blink");
        rightEye.classList.add("blink");
        setTimeout(() => {
            leftEye.classList.remove("blink");
            rightEye.classList.remove("blink");
        }, 120);
    }

    function applyEmote(name) {
        const emoteName = String(name || "").toLowerCase();
        if (!supportedEmotes.has(emoteName) || emoteName === currentEmote) return;
        eyes.classList.remove(`emote-${currentEmote}`);
        currentEmote = emoteName;
        eyes.classList.add(`emote-${currentEmote}`);
    }

    // IP loading via pywebview API
    async function loadIp() {
        if (!hasPyWebView) {
            menuIp.textContent = "IP: N/A (no pywebview)";
            return;
        }
        try {
            const result = await pywebview.api.getIp();
            menuIp.textContent = `IP: ${result.ip || "N/A"}`;
        } catch (e) {
            menuIp.textContent = "IP: N/A";
        }
    }

    function showMenu() {
        menuOverlay.classList.add("visible");
        menuOverlay.setAttribute("aria-hidden", "false");
        loadIp();
    }

    function hideMenu() {
        menuOverlay.classList.remove("visible");
        menuOverlay.setAttribute("aria-hidden", "true");
    }

    async function exitAll() {
        if (hasPyWebView) {
            try {
                await pywebview.api.shutdown();
            } catch (e) {
                console.error("Shutdown error:", e);
            }
        }
        // Fallback: attempt to close window
        setTimeout(() => {
            try { window.open("", "_self"); } catch (_) {}
            try { window.close(); } catch (_) {}
            window.location.href = "about:blank";
        }, 250);
    }

    touchZone.addEventListener("click", showMenu);
    menuOverlay.addEventListener("click", (event) => {
        if (event.target === menuOverlay) hideMenu();
    });
    menuHome.addEventListener("click", () => {
        window.location.href = "/";
    });
    menuExit.addEventListener("click", exitAll);

    // Blink animation (client-side, no backend needed)
    setInterval(() => {
        blink();
        if (Math.random() > 0.82) {
            setTimeout(blink, 140);
        }
    }, 3400);

    // Note: Eye position and emote updates are now pushed from Python
    // via the js_api bridge (evaluate_js calls to applyEmote and applyEyesPosition)
    // No more periodic fetch calls needed!

    // Initialize with default position
    applyEyesPosition(0, 0);
    </script>
</body>
</html>
