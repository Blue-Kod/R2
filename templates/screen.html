<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 - Экран (Liquid Glass)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at center, #111, #000);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: none;
        }
        .eyes-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 150px;
            transform: translateY(-80px);
        }
        .eye {
            width: 180px;
            height: 560px;
            background: rgba(255,255,255,0.9);
            border-radius: 200px;
            transition: transform 0.12s ease;
            transform-origin: center center;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
            /* Явное объявление CSS-переменных со значениями по умолчанию */
            --shake-x: 0px;
            --shake-y: 0px;
            transform: translate(var(--shake-x), var(--shake-y)) scaleY(1);
        }
        .eye.blink {
            transform: translate(var(--shake-x), var(--shake-y)) scaleY(0.08);
        }
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            backdrop-filter: blur(8px);
            color: #eee;
            font-family: monospace;
        }
        .menu-trigger {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 20;
            cursor: pointer;
        }
        .menu {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,30,0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 8px 0;
            min-width: 240px;
            display: none;
            flex-direction: column;
            z-index: 30;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .menu.visible { display: flex; }
        .menu-item {
            padding: 14px 24px;
            text-align: center;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }
        .menu-item:hover { background: rgba(255,255,255,0.15); }
        .menu-item.ip { background: #111; cursor: default; font-family: monospace; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="eyes-container">
    <div class="eye" id="leftEye"></div>
    <div class="eye" id="rightEye"></div>
</div>
<div class="overlay">
    <span id="metrics">CPU: --% RAM: --% TEMP: --</span>
    <span id="logsPreview">Консоль: готов</span>
</div>
<div class="menu-trigger" id="menuTrigger"></div>
<div class="menu" id="menu">
    <div class="menu-item ip" id="ipDisplay">IP: загрузка...</div>
    <div class="menu-item" id="homeBtn">🏠 На главную</div>
    <div class="menu-item" id="closeBtn">⏻ Завершить</div>
</div>

<script>
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const menuTrigger = document.getElementById('menuTrigger');
    const menu = document.getElementById('menu');
    const homeBtn = document.getElementById('homeBtn');
    const closeBtn = document.getElementById('closeBtn');
    const ipDisplay = document.getElementById('ipDisplay');
    const metricsSpan = document.getElementById('metrics');
    const logsPreview = document.getElementById('logsPreview');

    function blink() {
        if (leftEye.classList.contains('blink')) return;
        leftEye.classList.add('blink');
        rightEye.classList.add('blink');
        setTimeout(() => {
            leftEye.classList.remove('blink');
            rightEye.classList.remove('blink');
        }, 150);
        setTimeout(blink, Math.random() * 10000 + 4000);
    }
    blink();

    menuTrigger.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('visible'); });
    document.addEventListener('click', (e) => { if (!menu.contains(e.target) && e.target !== menuTrigger) menu.classList.remove('visible'); });
    homeBtn.addEventListener('click', () => window.location.href = '/');
    closeBtn.addEventListener('click', async () => {
        try {
            await fetch('/api/shutdown', { method: 'POST' });
            setTimeout(() => window.close(), 1000);
        } catch(e) { alert('Ошибка'); }
    });

    async function fetchIP() {
        try { const res = await fetch('/api/ip'); const data = await res.json(); ipDisplay.textContent = `IP: ${data.ip}`; } catch(e) { ipDisplay.textContent = 'IP: ---'; }
    }
    fetchIP();

    async function fetchData() {
        try {
            const res = await fetch('/api/data');
            const d = await res.json();
            metricsSpan.textContent = `CPU: ${d.cpu}%  RAM: ${d.ram}%  TEMP: ${d.temp}`;
            const logsRes = await fetch('/api/console_logs');
            const logsData = await logsRes.json();
            const lastLine = logsData.logs.split('\n').filter(l => l.trim()).pop() || '—';
            logsPreview.textContent = `⟫ ${lastLine.slice(0, 70)}`;
        } catch(e) {}
    }
    fetchData();
    setInterval(fetchData, 2000);

    function updateEyeOffsets() {
        fetch('/api/tracking/offsets').then(r=>r.json()).then(data => {
            const dx = data.dx.toFixed(1), dy = data.dy.toFixed(1);
            leftEye.style.setProperty('--shake-x', dx + 'px');
            leftEye.style.setProperty('--shake-y', dy + 'px');
            rightEye.style.setProperty('--shake-x', dx + 'px');
            rightEye.style.setProperty('--shake-y', dy + 'px');
        }).catch(console.error).then(() => setTimeout(updateEyeOffsets, 40));
    }
    updateEyeOffsets();
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.exitFullscreen) document.exitFullscreen(); });
</script>
</body>
</html>
